<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Score Tracker</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { touch-action: manipulation; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #1c1f26;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 12px max(40px, env(safe-area-inset-bottom));
  }
  button { touch-action: manipulation; -webkit-user-select: none; user-select: none; font-family: inherit; }

  .wrap { display: flex; flex-direction: column; align-items: center; width: 100%; }

  .timer-panel {
    background: #262a33;
    border-radius: 16px;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    width: 100%;
    max-width: 640px;
  }
  .timer-display {
    font-size: 2.6rem;
    font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .timer-display.time-up { color: #ff453a; }
  .timer-set {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #aaa;
    font-size: 0.9rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .timer-set select {
    font-size: 16px;
    background: #1c1f26;
    border: 1px solid #444956;
    border-radius: 6px;
    color: #fff;
    padding: 6px 8px;
  }
  .timer-set button {
    background: #333844;
    border: 1px solid #444956;
    color: #fff;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .timer-set button:hover { background: #3d434f; }
  .timer-buttons {
    display: flex;
    gap: 10px;
  }
  .timer-buttons button {
    background: #333844;
    border: 1px solid #444956;
    color: #fff;
    padding: 6px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .timer-buttons button:hover { background: #3d434f; }
  .timer-buttons button.primary { background: #4f8ef7; border-color: #4f8ef7; }
  .timer-buttons button.primary:hover { background: #3f7ee0; }

  .board {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    padding: 0 8px;
    width: 100%;
    max-width: 640px;
  }
  .player {
    position: relative;
    flex: 1 1 220px;
    max-width: 280px;
    background: #262a33;
    border-radius: 16px;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    border-top: 6px solid var(--accent, #4f8ef7);
  }

  .remove-player {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: #333844;
    color: #aaa;
    font-size: 0.95rem;
    line-height: 1;
    cursor: pointer;
  }
  .remove-player:hover { background: #ff453a; color: #fff; }

  .player-name {
    width: 100%;
    text-align: center;
    background: transparent;
    border: none;
    border-bottom: 2px dashed #444956;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    padding: 6px 4px;
    outline: none;
  }
  .player-name:focus { border-bottom-color: #888; }

  .score {
    font-size: 4rem;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    min-width: 2ch;
    text-align: center;
  }

  .buttons {
    display: flex;
    gap: 12px;
  }
  button.step {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    font-size: 1.8rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  button.step:active { transform: scale(0.9); }
  .plus { background: #34c759; }
  .minus { background: #ff453a; }

  .board-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .board-actions button {
    background: none;
    border: 1px solid #444956;
    color: #aaa;
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .board-actions button:hover { color: #fff; border-color: #888; }
  .board-actions button.add-player {
    color: #4f8ef7;
    border-color: #4f8ef7;
  }
  .board-actions button.add-player:hover { color: #fff; background: #4f8ef7; }

  .status { color: #666; font-size: 0.75rem; margin-top: 14px; min-height: 14px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">

  <div class="timer-panel">
    <div class="timer-display" id="timerDisplay">05:00</div>
    <div class="timer-set">
      <span>Set:</span>
      <select id="timerMin"></select> min
      <select id="timerSec"></select> sec
      <button onclick="applyTimerSet()">Set</button>
    </div>
    <div class="timer-buttons">
      <button class="primary" id="startPauseBtn" onclick="toggleTimer()">Start</button>
      <button onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <div class="board" id="board"></div>

  <div class="board-actions">
    <button class="add-player" onclick="addPlayer()">+ Add Player</button>
    <button onclick="resetScores()">Reset Scores</button>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
  const STATE_KEY = 'score-tracker-state';
  const ACCENTS = ['#4f8ef7', '#f75f4f', '#34c759', '#f7b84f', '#a374f7', '#4fd1f7', '#f74fa3', '#c0d94f'];

  let players = [];
  let nextId = 1;
  let persistenceBroken = false;

  let timerTotalSeconds = 300;
  let timerRemaining = 300;
  let timerInterval = null;
  let timerRunning = false;

  function showStatus(msg) {
    const el = document.getElementById('status');
    el.textContent = msg;
    clearTimeout(showStatus._t);
    showStatus._t = setTimeout(() => { el.textContent = ''; }, 1500);
  }

  // ---------- Timer ----------
  function populateTimerSelects() {
    const minSel = document.getElementById('timerMin');
    const secSel = document.getElementById('timerSec');
    for (let m = 0; m <= 59; m++) {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = m;
      if (m === 5) opt.selected = true;
      minSel.appendChild(opt);
    }
    for (let s = 0; s <= 59; s++) {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s.toString().padStart(2, '0');
      if (s === 0) opt.selected = true;
      secSel.appendChild(opt);
    }
  }

  function formatTime(totalSec) {
    const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
    const s = Math.floor(totalSec % 60).toString().padStart(2, '0');
    return m + ':' + s;
  }

  function updateTimerDisplay() {
    const el = document.getElementById('timerDisplay');
    el.textContent = formatTime(Math.max(timerRemaining, 0));
    el.classList.toggle('time-up', timerRemaining <= 0);
  }

  function applyTimerSet() {
    const min = parseInt(document.getElementById('timerMin').value, 10) || 0;
    const sec = parseInt(document.getElementById('timerSec').value, 10) || 0;
    timerTotalSeconds = min * 60 + sec;
    timerRemaining = timerTotalSeconds;
    pauseTimer();
    updateTimerDisplay();
    saveState();
  }

  function toggleTimer() {
    if (timerRunning) {
      pauseTimer();
    } else {
      startTimer();
    }
  }

  function startTimer() {
    if (timerRemaining <= 0) return;
    timerRunning = true;
    document.getElementById('startPauseBtn').textContent = 'Pause';
    timerInterval = setInterval(() => {
      timerRemaining -= 1;
      updateTimerDisplay();
      saveState();
      if (timerRemaining <= 0) {
        pauseTimer();
        showStatus("Time's up");
      }
    }, 1000);
  }

  function pauseTimer() {
    timerRunning = false;
    document.getElementById('startPauseBtn').textContent = 'Start';
    clearInterval(timerInterval);
    saveState();
  }

  function resetTimer() {
    pauseTimer();
    timerRemaining = timerTotalSeconds;
    updateTimerDisplay();
    saveState();
  }

  // ---------- Players / Board ----------
  function defaultPlayers() {
    return [
      { id: 1, name: 'Player 1', score: 0 },
      { id: 2, name: 'Player 2', score: 0 }
    ];
  }

  function renderBoard() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    players.forEach((p, idx) => {
      const card = document.createElement('div');
      card.className = 'player';
      card.style.setProperty('--accent', ACCENTS[idx % ACCENTS.length]);

      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-player';
      removeBtn.textContent = '×';
      removeBtn.title = 'Remove player';
      removeBtn.onclick = () => removePlayer(p.id);
      card.appendChild(removeBtn);

      const nameInput = document.createElement('input');
      nameInput.className = 'player-name';
      nameInput.value = p.name;
      nameInput.maxLength = 24;
      nameInput.oninput = (e) => { p.name = e.target.value; saveState(); };
      card.appendChild(nameInput);

      const scoreEl = document.createElement('div');
      scoreEl.className = 'score';
      scoreEl.textContent = p.score;
      card.appendChild(scoreEl);

      const btnRow = document.createElement('div');
      btnRow.className = 'buttons';

      const minusBtn = document.createElement('button');
      minusBtn.className = 'step minus';
      minusBtn.textContent = '−';
      minusBtn.onclick = () => { p.score -= 1; scoreEl.textContent = p.score; saveState(); };
      btnRow.appendChild(minusBtn);

      const plusBtn = document.createElement('button');
      plusBtn.className = 'step plus';
      plusBtn.textContent = '+';
      plusBtn.onclick = () => { p.score += 1; scoreEl.textContent = p.score; saveState(); };
      btnRow.appendChild(plusBtn);

      card.appendChild(btnRow);
      board.appendChild(card);
    });

    document.querySelectorAll('.remove-player').forEach(btn => {
      btn.style.display = players.length <= 1 ? 'none' : '';
    });
  }

  function addPlayer() {
    nextId = players.reduce((max, p) => Math.max(max, p.id), 0) + 1;
    players.push({ id: nextId, name: 'Player ' + players.length, score: 0 });
    renderBoard();
    saveState();
  }

  function removePlayer(id) {
    if (players.length <= 1) return;
    players = players.filter(p => p.id !== id);
    renderBoard();
    saveState();
  }

  function resetScores() {
    players.forEach(p => p.score = 0);
    renderBoard();
    saveState();
  }

  // ---------- Persistence ----------
  function saveState() {
    if (persistenceBroken) return;
    const state = { players, timerTotalSeconds, timerRemaining, timerRunning };
    try {
      localStorage.setItem(STATE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error('Save failed', e);
      persistenceBroken = true;
      showStatus('Persistence unavailable in this browser view');
    }
  }

  function loadState() {
    populateTimerSelects();
    try {
      const raw = localStorage.getItem(STATE_KEY);
      if (raw) {
        const state = JSON.parse(raw);
        if (Array.isArray(state.players) && state.players.length > 0) {
          players = state.players.map(p => ({
            id: p.id, name: p.name || 'Player', score: Number(p.score) || 0
          }));
        } else {
          players = defaultPlayers();
        }
        if (typeof state.timerTotalSeconds === 'number') {
          timerTotalSeconds = state.timerTotalSeconds;
          document.getElementById('timerMin').value = Math.floor(timerTotalSeconds / 60);
          document.getElementById('timerSec').value = timerTotalSeconds % 60;
        }
        if (typeof state.timerRemaining === 'number') {
          timerRemaining = state.timerRemaining;
        }
        renderBoard();
        updateTimerDisplay();
        showStatus('Loaded saved session');
        return;
      }
    } catch (e) {
      persistenceBroken = true;
    }
    players = defaultPlayers();
    renderBoard();
    updateTimerDisplay();
  }

  loadState();
</script>
</body>
</html>
