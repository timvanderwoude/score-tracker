<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c1f26">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234f8ef7'/%3E%3Ctext x='50' y='68' font-size='58' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3E%23%3C/text%3E%3C/svg%3E">
<title>Score Tracker</title>
<script>
  // Resolve theme before first paint to avoid a flash of the wrong theme.
  (function () {
    try {
      var raw = localStorage.getItem('score-tracker-settings');
      var theme = raw ? (JSON.parse(raw).theme || 'system') : 'system';
      var resolved = theme === 'system'
        ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : theme;
      document.documentElement.setAttribute('data-theme', resolved);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<style>
  :root {
    --bg: #1c1f26;
    --panel: #262a33;
    --panel-2: #2e333e;
    --border: #444956;
    --text: #ffffff;
    --text-dim: #9aa0ab;
    --text-faint: #666c78;
    --blue: #4f8ef7;
    --green: #34c759;
    --red: #ff453a;
    --shadow: rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #eef0f4;
    --panel: #ffffff;
    --panel-2: #f4f5f8;
    --border: #d9dce2;
    --text: #1c1f26;
    --text-dim: #666c78;
    --text-faint: #9aa0ab;
    --shadow: rgba(30, 34, 44, 0.12);
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    transition: background 0.2s ease, color 0.2s ease;
  }
  button, input, select { font-family: inherit; }
  button { touch-action: manipulation; -webkit-user-select: none; user-select: none; }

  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    gap: 8px;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: relative;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border-radius: 14px;
    padding: 8px 10px;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .timer-chip {
    position: relative;
    z-index: 22;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 1.15rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .timer-chip .mode-icon { font-size: 0.9rem; opacity: 0.7; }
  .timer-chip.time-up { color: var(--red); }
  .timer-chip.shake { animation: shake 0.35s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  .icon-btn {
    position: relative;
    z-index: 22;
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn:disabled { opacity: 0.35; cursor: default; }
  .icon-btn:disabled:active { transform: none; }
  .icon-btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .spacer { flex: 1 1 auto; }

  .timer-drawer-backdrop {
    position: fixed;
    inset: 0;
    background: transparent;
    z-index: 20;
  }
  .timer-drawer {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    z-index: 21;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 8px 24px var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .seg {
    display: flex;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 3px;
  }
  .seg button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-dim);
    padding: 7px 10px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .seg button.active { background: var(--blue); color: #fff; }

  .timer-set-fields {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  .timer-set-fields select {
    font-size: 16px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 6px 8px;
  }
  .pill-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .pill-btn:active { transform: scale(0.96); }
  .pill-btn:hover { color: var(--text); border-color: var(--text-faint); }
  .pill-btn.accent { color: var(--blue); border-color: var(--blue); }
  .pill-btn.accent:hover { color: #fff; background: var(--blue); }
  .pill-btn.danger { color: var(--red); border-color: var(--red); }
  .pill-btn.danger:hover { color: #fff; background: var(--red); }
  .pill-btn:disabled { opacity: 0.35; cursor: default; transform: none; }
  .pill-btn.full { width: 100%; }

  /* ---------- Board ---------- */
  .board {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    gap: calc(10px * var(--card-scale, 1));
    overflow: auto;
  }

  .player {
    position: relative;
    background: var(--panel);
    border-radius: calc(14px * var(--card-scale, 1));
    padding: calc(16px * var(--card-scale, 1)) calc(12px * var(--card-scale, 1));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(8px * var(--card-scale, 1));
    border-top: calc(5px * var(--card-scale, 1)) solid var(--accent, #4f8ef7);
    box-shadow: 0 2px 8px var(--shadow);
    min-width: 0;
    min-height: 0;
    transition: box-shadow 0.2s ease;
  }
  .player.is-turn {
    box-shadow: 0 0 0 calc(3px * var(--card-scale, 1)) var(--accent, #4f8ef7), 0 4px 16px var(--shadow);
  }

  .remove-player {
    position: absolute;
    top: calc(6px * var(--card-scale, 1));
    right: calc(6px * var(--card-scale, 1));
    width: calc(24px * var(--card-scale, 1));
    height: calc(24px * var(--card-scale, 1));
    min-width: 18px;
    min-height: 18px;
    border-radius: 50%;
    border: none;
    background: var(--panel-2);
    color: var(--text-dim);
    font-size: calc(0.9rem * var(--card-scale, 1));
    line-height: 1;
    cursor: pointer;
  }
  .remove-player:hover { background: var(--red); color: #fff; }

  .crown {
    position: absolute;
    top: calc(6px * var(--card-scale, 1));
    left: calc(8px * var(--card-scale, 1));
    font-size: calc(1rem * var(--card-scale, 1));
  }

  .player-name {
    width: 100%;
    max-width: 100%;
    text-align: center;
    background: transparent;
    border: none;
    border-bottom: 2px dashed var(--border);
    color: var(--text);
    font-size: calc(14px * var(--card-scale, 1));
    font-weight: 600;
    padding: calc(4px * var(--card-scale, 1)) 2px;
    outline: none;
    text-overflow: ellipsis;
  }
  .player-name:focus { border-bottom-color: var(--text-faint); }

  .score-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: calc(10px * var(--card-scale, 1));
    min-height: 0;
  }
  .score-tap {
    position: relative;
    cursor: pointer;
  }
  .score {
    font-size: calc(3rem * var(--card-scale, 1));
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    min-width: 1.4ch;
    text-align: center;
  }
  .score-input {
    font-size: calc(3rem * var(--card-scale, 1));
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    width: calc(3.4ch + 8px);
    text-align: center;
    background: var(--panel-2);
    border: 1px solid var(--blue);
    border-radius: 8px;
    outline: none;
  }
  .edit-hint {
    position: absolute;
    top: calc(-2px * var(--card-scale, 1));
    right: calc(-14px * var(--card-scale, 1));
    font-size: calc(0.7rem * var(--card-scale, 1));
    opacity: 0.4;
  }
  .score-tap:active { opacity: 0.7; }

  button.step {
    width: calc(46px * var(--card-scale, 1));
    height: calc(46px * var(--card-scale, 1));
    min-width: 26px;
    min-height: 26px;
    border-radius: 50%;
    border: none;
    font-size: calc(1.5rem * var(--card-scale, 1));
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    flex: 0 0 auto;
  }
  button.step:active { transform: scale(0.9); }
  .plus { background: var(--green); }
  .minus { background: var(--red); }

  /* ---------- Bottom bar ---------- */
  .bottombar {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(12px);
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 50;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Settings sheet ---------- */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: flex-end;
    z-index: 40;
  }
  .sheet {
    width: 100%;
    max-height: min(88dvh, 720px);
    background: var(--bg);
    border-radius: 20px 20px 0 0;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -8px 30px var(--shadow);
  }
  .sheet-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px 8px;
  }
  .sheet-header h2 { margin: 0; font-size: 1.15rem; }
  .sheet-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 4px 18px calc(24px + env(safe-area-inset-bottom));
  }
  .settings-section { margin-bottom: 22px; }
  .settings-section h3 {
    margin: 0 0 10px;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-row > span { font-size: 0.95rem; }
  .setting-row .seg { max-width: 200px; }

  .switch { position: relative; display: inline-block; width: 46px; height: 27px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider {
    position: absolute; inset: 0; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 999px; transition: 0.15s;
  }
  .switch .slider::before {
    content: ""; position: absolute; height: 19px; width: 19px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: 0.15s;
  }
  .switch input:checked + .slider { background: var(--blue); border-color: var(--blue); }
  .switch input:checked + .slider::before { transform: translateX(19px); }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="timer-chip" id="timerChip" aria-label="Open timer settings">
      <span class="mode-icon" id="timerModeIcon">⏳</span>
      <span id="timerChipTime">05:00</span>
    </button>
    <button class="icon-btn primary" id="timerToggleBtn" aria-label="Start timer">▶</button>
    <div class="spacer"></div>
    <button class="icon-btn" id="undoBtn" aria-label="Undo" disabled>↺</button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>

    <div class="timer-drawer-backdrop" id="timerDrawerBackdrop" hidden></div>
    <div class="timer-drawer" id="timerDrawer" hidden>
      <div class="seg" id="timerModeSeg">
        <button data-mode="countdown" class="active">Countdown</button>
        <button data-mode="stopwatch">Stopwatch</button>
      </div>
      <div class="timer-set-fields" id="timerSetFields">
        <span>Set:</span>
        <select id="timerMin"></select> min
        <select id="timerSec"></select> sec
        <button class="pill-btn accent" id="applyTimerBtn">Set</button>
      </div>
      <button class="pill-btn" id="timerResetBtn">Reset Timer</button>
    </div>
  </header>

  <main class="board" id="board"></main>

  <footer class="bottombar">
    <button class="pill-btn" id="nextTurnBtn" hidden>Next turn →</button>
    <button class="pill-btn accent" id="addPlayerBtn">+ Player</button>
    <button class="pill-btn" id="resetScoresBtn">Reset Scores</button>
  </footer>
</div>

<div class="toast" id="toast"></div>

<div class="sheet-overlay" id="settingsOverlay" hidden>
  <div class="sheet" role="dialog" aria-label="Settings">
    <div class="sheet-header">
      <h2>Settings</h2>
      <button class="icon-btn" id="closeSettingsBtn" aria-label="Close settings">✕</button>
    </div>
    <div class="sheet-body">
      <div class="settings-section">
        <h3>Scoring</h3>
        <div class="setting-row">
          <span>Score step</span>
          <div class="seg" id="scoreStepSeg">
            <button data-step="1" class="active">1</button>
            <button data-step="5">5</button>
            <button data-step="10">10</button>
          </div>
        </div>
        <div class="setting-row">
          <span>Allow negative scores</span>
          <label class="switch"><input type="checkbox" id="allowNegativeToggle" checked><span class="slider"></span></label>
        </div>
        <div class="setting-row">
          <span>Highlight leader</span>
          <div class="seg" id="winnerRuleSeg">
            <button data-rule="highest" class="active">Highest</button>
            <button data-rule="lowest">Lowest</button>
            <button data-rule="off">Off</button>
          </div>
        </div>
        <div class="setting-row">
          <span>Turn tracking</span>
          <label class="switch"><input type="checkbox" id="turnTrackingToggle"><span class="slider"></span></label>
        </div>
      </div>

      <div class="settings-section">
        <h3>Timer &amp; Alerts</h3>
        <div class="setting-row">
          <span>Sound</span>
          <label class="switch"><input type="checkbox" id="soundToggle" checked><span class="slider"></span></label>
        </div>
        <div class="setting-row">
          <span>Vibration</span>
          <label class="switch"><input type="checkbox" id="vibrationToggle" checked><span class="slider"></span></label>
        </div>
        <div class="setting-row">
          <span>Keep screen awake</span>
          <label class="switch"><input type="checkbox" id="keepAwakeToggle"><span class="slider"></span></label>
        </div>
      </div>

      <div class="settings-section">
        <h3>Display</h3>
        <div class="setting-row">
          <span>Theme</span>
          <div class="seg" id="themeSeg">
            <button data-theme="system" class="active">Auto</button>
            <button data-theme="dark">Dark</button>
            <button data-theme="light">Light</button>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <h3>Danger Zone</h3>
        <button class="pill-btn danger full" id="resetAllBtn">Reset Everything</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var STATE_KEY = 'score-tracker-state';
  var SETTINGS_KEY = 'score-tracker-settings';
  var MAX_PLAYERS = 12;
  var ACCENTS = ['#4f8ef7', '#f75f4f', '#34c759', '#f7b84f', '#a374f7', '#4fd1f7', '#f74fa3', '#c0d94f', '#ff8a5c', '#5ce1e6', '#e65c9c', '#8ce65c'];

  var els = {};
  ['app', 'board', 'timerChip', 'timerChipTime', 'timerModeIcon', 'timerToggleBtn',
   'undoBtn', 'settingsBtn', 'timerDrawer', 'timerDrawerBackdrop', 'timerModeSeg',
   'timerSetFields', 'timerMin', 'timerSec', 'applyTimerBtn', 'timerResetBtn',
   'nextTurnBtn', 'addPlayerBtn', 'resetScoresBtn', 'toast', 'settingsOverlay',
   'closeSettingsBtn', 'scoreStepSeg', 'allowNegativeToggle', 'winnerRuleSeg',
   'turnTrackingToggle', 'soundToggle', 'vibrationToggle', 'keepAwakeToggle', 'themeSeg',
   'resetAllBtn'].forEach(function (id) { els[id] = document.getElementById(id); });

  var persistenceBroken = false;

  var settings = {
    theme: 'system',
    scoreStep: 1,
    allowNegative: true,
    winnerRule: 'highest',
    turnTracking: false,
    keepAwake: false,
    sound: true,
    vibration: true
  };

  var players = [];
  var playerCounter = 2;
  var currentTurnId = null;

  var timer = {
    mode: 'countdown',        // 'countdown' | 'stopwatch'
    totalSeconds: 300,        // countdown target
    endAt: null,              // epoch ms when countdown running
    remainingAtPause: 300,    // countdown remaining while paused
    startAt: null,            // epoch ms when stopwatch running
    accumulated: 0,           // stopwatch accumulated ms while paused
    running: false
  };
  var timerRAF = null;

  var undoStack = [];
  var audioCtx = null;

  // ---------- Utilities ----------
  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

  function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { els.toast.classList.remove('show'); }, 1600);
  }

  function vibrate(pattern) {
    if (!settings.vibration || !navigator.vibrate) return;
    try { navigator.vibrate(pattern); } catch (e) {}
  }

  function beep(freq, duration, delay) {
    if (!settings.sound) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var t0 = audioCtx.currentTime + (delay || 0);
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.18, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + (duration || 0.15));
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + (duration || 0.15) + 0.02);
    } catch (e) {}
  }

  function tapFeedback() { vibrate(8); }

  function timeUpAlert() {
    beep(880, 0.16, 0); beep(880, 0.16, 0.22); beep(1046, 0.22, 0.44);
    vibrate([150, 90, 150, 90, 220]);
  }

  // ---------- Theme ----------
  function resolveTheme() {
    return settings.theme === 'system'
      ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      : settings.theme;
  }
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', resolveTheme());
  }
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function () {
    if (settings.theme === 'system') applyTheme();
  });

  // ---------- Wake Lock ----------
  var wakeLock = null;
  function requestWakeLock() {
    if (!settings.keepAwake || !('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
    }).catch(function () { /* ignore: no user gesture yet, or unsupported */ });
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && settings.keepAwake) requestWakeLock();
  });

  // ---------- Undo ----------
  function snapshot() {
    undoStack.push({
      players: JSON.parse(JSON.stringify(players)),
      playerCounter: playerCounter,
      currentTurnId: currentTurnId
    });
    if (undoStack.length > 25) undoStack.shift();
    els.undoBtn.disabled = false;
  }
  function undo() {
    var snap = undoStack.pop();
    if (!snap) return;
    players = snap.players;
    playerCounter = snap.playerCounter;
    currentTurnId = snap.currentTurnId;
    els.undoBtn.disabled = undoStack.length === 0;
    renderBoard();
    saveState();
    showToast('Undone');
  }

  // ---------- Timer ----------
  function populateTimerSelects() {
    for (var m = 0; m <= 59; m++) {
      var o1 = document.createElement('option');
      o1.value = m; o1.textContent = m;
      if (m === 5) o1.selected = true;
      els.timerMin.appendChild(o1);
    }
    for (var s = 0; s <= 59; s++) {
      var o2 = document.createElement('option');
      o2.value = s; o2.textContent = String(s).padStart(2, '0');
      if (s === 0) o2.selected = true;
      els.timerSec.appendChild(o2);
    }
  }

  function formatTime(totalSec) {
    totalSec = Math.max(0, Math.round(totalSec));
    var m = Math.floor(totalSec / 60).toString().padStart(2, '0');
    var s = Math.floor(totalSec % 60).toString().padStart(2, '0');
    return m + ':' + s;
  }

  function countdownRemaining() {
    if (timer.running) return Math.max(0, (timer.endAt - Date.now()) / 1000);
    return timer.remainingAtPause;
  }
  function stopwatchElapsed() {
    var ms = timer.accumulated + (timer.running ? (Date.now() - timer.startAt) : 0);
    return ms / 1000;
  }

  function updateTimerDisplay() {
    var seconds = timer.mode === 'countdown' ? countdownRemaining() : stopwatchElapsed();
    els.timerChipTime.textContent = formatTime(seconds);
    els.timerModeIcon.textContent = timer.mode === 'countdown' ? '⏳' : '⏱';
    els.timerChip.classList.toggle('time-up', timer.mode === 'countdown' && seconds <= 0);
    els.timerToggleBtn.textContent = timer.running ? '⏸' : '▶';
    els.timerToggleBtn.setAttribute('aria-label', timer.running ? 'Pause timer' : 'Start timer');
  }

  function timerTick() {
    if (!timer.running) return;
    if (timer.mode === 'countdown') {
      var remaining = countdownRemaining();
      updateTimerDisplay();
      if (remaining <= 0) {
        pauseTimer();
        els.timerChip.classList.add('shake');
        setTimeout(function () { els.timerChip.classList.remove('shake'); }, 400);
        showToast("Time's up");
        timeUpAlert();
        return;
      }
    } else {
      updateTimerDisplay();
    }
    timerRAF = requestAnimationFrame(timerTick);
  }

  function startTimer() {
    if (timer.mode === 'countdown' && countdownRemaining() <= 0) {
      els.timerChip.classList.add('shake');
      setTimeout(function () { els.timerChip.classList.remove('shake'); }, 400);
      showToast('Set a time first');
      return;
    }
    if (timer.mode === 'countdown') {
      timer.endAt = Date.now() + countdownRemaining() * 1000;
    } else {
      timer.startAt = Date.now();
    }
    timer.running = true;
    cancelAnimationFrame(timerRAF);
    timerRAF = requestAnimationFrame(timerTick);
    saveState();
    updateTimerDisplay();
  }

  function pauseTimer() {
    if (timer.mode === 'countdown') {
      timer.remainingAtPause = countdownRemaining();
    } else {
      timer.accumulated = timer.accumulated + (timer.running ? (Date.now() - timer.startAt) : 0);
    }
    timer.running = false;
    cancelAnimationFrame(timerRAF);
    saveState();
    updateTimerDisplay();
  }

  function toggleTimer() { timer.running ? pauseTimer() : startTimer(); }

  function resetTimer() {
    var wasRunning = timer.running;
    timer.running = false;
    cancelAnimationFrame(timerRAF);
    if (timer.mode === 'countdown') {
      timer.remainingAtPause = timer.totalSeconds;
      timer.endAt = null;
    } else {
      timer.accumulated = 0;
      timer.startAt = null;
    }
    updateTimerDisplay();
    saveState();
    if (wasRunning) showToast('Timer reset');
  }

  function applyTimerSet() {
    var min = parseInt(els.timerMin.value, 10) || 0;
    var sec = parseInt(els.timerSec.value, 10) || 0;
    timer.totalSeconds = min * 60 + sec;
    timer.remainingAtPause = timer.totalSeconds;
    timer.running = false;
    cancelAnimationFrame(timerRAF);
    updateTimerDisplay();
    saveState();
  }

  function setTimerMode(mode) {
    if (timer.mode === mode) return;
    pauseTimer();
    timer.mode = mode;
    els.timerSetFields.hidden = mode !== 'countdown';
    setSegActive(els.timerModeSeg, 'mode', mode);
    updateTimerDisplay();
    saveState();
  }

  function openTimerDrawer() {
    els.timerDrawer.hidden = false;
    els.timerDrawerBackdrop.hidden = false;
  }
  function closeTimerDrawer() {
    els.timerDrawer.hidden = true;
    els.timerDrawerBackdrop.hidden = true;
  }

  // ---------- Grid layout ----------
  function computeGrid(n, w, h) {
    if (n <= 0) return { cols: 1, rows: 1 };
    var best = null;
    for (var cols = 1; cols <= n; cols++) {
      var rows = Math.ceil(n / cols);
      var cellW = w / cols;
      var cellH = h / rows;
      var score = Math.min(cellW, cellH);
      if (!best || score > best.score) best = { cols: cols, rows: rows, score: score, cellW: cellW, cellH: cellH };
    }
    return best;
  }

  function relayoutBoard() {
    var rect = els.board.getBoundingClientRect();
    var w = rect.width, h = rect.height;
    if (w === 0 || h === 0) return;
    var g = computeGrid(players.length, w, h);
    els.board.style.gridTemplateColumns = 'repeat(' + g.cols + ', 1fr)';
    els.board.style.gridTemplateRows = 'repeat(' + g.rows + ', 1fr)';
    var scale = clamp(Math.min(g.cellW / 250, g.cellH / 220), 0.4, 1.3);
    els.board.style.setProperty('--card-scale', scale.toFixed(3));
  }

  var relayoutQueued = false;
  function scheduleRelayout() {
    if (relayoutQueued) return;
    relayoutQueued = true;
    requestAnimationFrame(function () { relayoutQueued = false; relayoutBoard(); });
  }
  window.addEventListener('resize', scheduleRelayout);
  window.addEventListener('orientationchange', scheduleRelayout);

  // ---------- Players / board ----------
  function defaultPlayers() {
    return [
      { id: 1, name: 'Player 1', score: 0 },
      { id: 2, name: 'Player 2', score: 0 }
    ];
  }

  function leaderIds() {
    if (settings.winnerRule === 'off' || players.length === 0) return [];
    var scores = players.map(function (p) { return p.score; });
    var allEqual = scores.every(function (s) { return s === scores[0]; });
    if (allEqual) return [];
    var target = settings.winnerRule === 'lowest' ? Math.min.apply(null, scores) : Math.max.apply(null, scores);
    return players.filter(function (p) { return p.score === target; }).map(function (p) { return p.id; });
  }

  function applyDelta(p, scoreEl, delta) {
    var next = p.score + delta;
    if (!settings.allowNegative) next = Math.max(0, next);
    p.score = next;
    scoreEl.textContent = p.score;
    updateCrowns();
    saveState();
  }

  function updateCrowns() {
    var leaders = leaderIds();
    els.board.querySelectorAll('.player').forEach(function (card) {
      var id = Number(card.dataset.id);
      var crown = card.querySelector('.crown');
      if (!crown) return;
      crown.hidden = leaders.indexOf(id) === -1;
    });
  }

  function beginPressHold(fn) {
    var timeoutId, intervalId;
    return {
      start: function () {
        fn();
        timeoutId = setTimeout(function () {
          intervalId = setInterval(fn, 100);
        }, 420);
      },
      stop: function () {
        clearTimeout(timeoutId);
        clearInterval(intervalId);
      }
    };
  }

  function renderBoard() {
    els.board.innerHTML = '';
    players.forEach(function (p, idx) {
      var card = document.createElement('div');
      card.className = 'player';
      card.dataset.id = p.id;
      card.style.setProperty('--accent', ACCENTS[idx % ACCENTS.length]);
      if (settings.turnTracking && p.id === currentTurnId) card.classList.add('is-turn');

      var crown = document.createElement('div');
      crown.className = 'crown';
      crown.textContent = '👑';
      crown.hidden = true;
      card.appendChild(crown);

      var removeBtn = document.createElement('button');
      removeBtn.className = 'remove-player';
      removeBtn.textContent = '×';
      removeBtn.title = 'Remove player';
      removeBtn.setAttribute('aria-label', 'Remove ' + p.name);
      removeBtn.onclick = function () { removePlayer(p.id); };
      card.appendChild(removeBtn);

      var nameInput = document.createElement('input');
      nameInput.className = 'player-name';
      nameInput.value = p.name;
      nameInput.maxLength = 24;
      nameInput.setAttribute('aria-label', 'Player name');
      nameInput.oninput = function (e) { p.name = e.target.value; saveState(); };
      card.appendChild(nameInput);

      var scoreWrap = document.createElement('div');
      scoreWrap.className = 'score-wrap';

      var minusBtn = document.createElement('button');
      minusBtn.className = 'step minus';
      minusBtn.textContent = '−';
      minusBtn.setAttribute('aria-label', 'Decrease score');

      var scoreTap = document.createElement('div');
      scoreTap.className = 'score-tap';
      var scoreEl = document.createElement('div');
      scoreEl.className = 'score';
      scoreEl.textContent = p.score;
      var editHint = document.createElement('span');
      editHint.className = 'edit-hint';
      editHint.textContent = '✎';
      scoreTap.appendChild(scoreEl);
      scoreTap.appendChild(editHint);
      scoreTap.onclick = function () { beginScoreEdit(p, scoreTap, scoreEl); };

      var plusBtn = document.createElement('button');
      plusBtn.className = 'step plus';
      plusBtn.textContent = '+';
      plusBtn.setAttribute('aria-label', 'Increase score');

      var minusHold = beginPressHold(function () { applyDelta(p, scoreEl, -settings.scoreStep); });
      var plusHold = beginPressHold(function () { applyDelta(p, scoreEl, settings.scoreStep); });
      minusBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); snapshot(); minusHold.start(); });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { minusBtn.addEventListener(ev, minusHold.stop); });
      plusBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); snapshot(); plusHold.start(); });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { plusBtn.addEventListener(ev, plusHold.stop); });

      scoreWrap.appendChild(minusBtn);
      scoreWrap.appendChild(scoreTap);
      scoreWrap.appendChild(plusBtn);
      card.appendChild(scoreWrap);

      els.board.appendChild(card);
    });

    els.board.querySelectorAll('.remove-player').forEach(function (btn) {
      btn.style.display = players.length <= 1 ? 'none' : '';
    });

    els.addPlayerBtn.disabled = players.length >= MAX_PLAYERS;
    els.nextTurnBtn.hidden = !settings.turnTracking || players.length === 0;

    updateCrowns();
    scheduleRelayout();
  }

  function beginScoreEdit(p, scoreTap, scoreEl) {
    if (scoreTap.querySelector('.score-input')) return;
    snapshot();
    var input = document.createElement('input');
    input.type = 'number';
    input.className = 'score-input';
    input.value = p.score;
    scoreTap.replaceChild(input, scoreEl);
    input.focus();
    input.select();

    function commit() {
      var val = parseInt(input.value, 10);
      if (isNaN(val)) val = p.score;
      if (!settings.allowNegative) val = Math.max(0, val);
      p.score = val;
      scoreEl.textContent = p.score;
      if (input.parentNode) scoreTap.replaceChild(scoreEl, input);
      updateCrowns();
      saveState();
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape') { input.value = p.score; input.blur(); }
    });
  }

  function addPlayer() {
    if (players.length >= MAX_PLAYERS) { showToast('Max ' + MAX_PLAYERS + ' players'); return; }
    snapshot();
    playerCounter += 1;
    players.push({ id: Date.now() + Math.random(), name: 'Player ' + playerCounter, score: 0 });
    renderBoard();
    saveState();
  }

  function removePlayer(id) {
    if (players.length <= 1) return;
    snapshot();
    players = players.filter(function (p) { return p.id !== id; });
    if (currentTurnId === id) currentTurnId = players.length ? players[0].id : null;
    renderBoard();
    saveState();
  }

  function resetScores() {
    snapshot();
    players.forEach(function (p) { p.score = 0; });
    renderBoard();
    saveState();
    showToast('Scores reset');
  }

  function resetEverything() {
    snapshot();
    players = defaultPlayers();
    playerCounter = 2;
    currentTurnId = null;
    resetTimer();
    renderBoard();
    saveState();
    closeSettings();
    showToast('Everything reset');
  }

  function nextTurn() {
    if (players.length === 0) return;
    var idx = players.findIndex(function (p) { return p.id === currentTurnId; });
    idx = (idx === -1 ? 0 : idx + 1) % players.length;
    currentTurnId = players[idx].id;
    tapFeedback();
    renderBoard();
    saveState();
  }

  // ---------- Settings UI ----------
  function setSegActive(container, dataAttr, value) {
    container.querySelectorAll('button').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset[dataAttr] === String(value));
    });
  }

  function openSettings() { els.settingsOverlay.hidden = false; }
  function closeSettings() { els.settingsOverlay.hidden = true; }

  function syncSettingsUI() {
    setSegActive(els.scoreStepSeg, 'step', settings.scoreStep);
    setSegActive(els.winnerRuleSeg, 'rule', settings.winnerRule);
    setSegActive(els.themeSeg, 'theme', settings.theme);
    els.allowNegativeToggle.checked = settings.allowNegative;
    els.turnTrackingToggle.checked = settings.turnTracking;
    els.soundToggle.checked = settings.sound;
    els.vibrationToggle.checked = settings.vibration;
    els.keepAwakeToggle.checked = settings.keepAwake;
  }

  // ---------- Persistence ----------
  function saveState() {
    if (persistenceBroken) return;
    try {
      var timerPayload = { mode: timer.mode, totalSeconds: timer.totalSeconds, running: timer.running };
      if (timer.mode === 'countdown') {
        if (timer.running) { timerPayload.endAt = timer.endAt; }
        else { timerPayload.remainingAtPause = timer.remainingAtPause; }
      } else {
        timerPayload.accumulated = timer.accumulated;
        if (timer.running) { timerPayload.startAt = timer.startAt; }
      }
      localStorage.setItem(STATE_KEY, JSON.stringify({
        players: players, playerCounter: playerCounter, currentTurnId: currentTurnId,
        timer: timerPayload
      }));
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    } catch (e) {
      persistenceBroken = true;
      showToast('Persistence unavailable in this view');
    }
  }

  function loadSettings() {
    try {
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) {
        var loaded = JSON.parse(raw);
        Object.keys(settings).forEach(function (k) {
          if (loaded[k] !== undefined) settings[k] = loaded[k];
        });
      }
    } catch (e) { persistenceBroken = true; }
  }

  function loadState() {
    populateTimerSelects();
    try {
      var raw = localStorage.getItem(STATE_KEY);
      if (raw) {
        var state = JSON.parse(raw);
        if (Array.isArray(state.players) && state.players.length > 0) {
          players = state.players.map(function (p) {
            return { id: p.id, name: p.name || 'Player', score: Number(p.score) || 0 };
          });
        } else {
          players = defaultPlayers();
        }
        playerCounter = typeof state.playerCounter === 'number' ? state.playerCounter : players.length;
        currentTurnId = state.currentTurnId != null ? state.currentTurnId : null;

        if (state.timer) {
          timer.mode = state.timer.mode === 'stopwatch' ? 'stopwatch' : 'countdown';
          timer.totalSeconds = typeof state.timer.totalSeconds === 'number' ? state.timer.totalSeconds : 300;
          els.timerMin.value = Math.floor(timer.totalSeconds / 60);
          els.timerSec.value = timer.totalSeconds % 60;
          els.timerSetFields.hidden = timer.mode !== 'countdown';
          setSegActive(els.timerModeSeg, 'mode', timer.mode);

          if (timer.mode === 'countdown') {
            if (state.timer.running && typeof state.timer.endAt === 'number') {
              var remaining = (state.timer.endAt - Date.now()) / 1000;
              if (remaining > 0) {
                timer.endAt = state.timer.endAt;
                timer.running = true;
              } else {
                timer.running = false;
                timer.remainingAtPause = 0;
              }
            } else {
              timer.running = false;
              timer.remainingAtPause = typeof state.timer.remainingAtPause === 'number' ? state.timer.remainingAtPause : timer.totalSeconds;
            }
          } else {
            timer.accumulated = typeof state.timer.accumulated === 'number' ? state.timer.accumulated : 0;
            if (state.timer.running && typeof state.timer.startAt === 'number') {
              timer.startAt = state.timer.startAt;
              timer.running = true;
            } else {
              timer.running = false;
            }
          }
        }
      } else {
        players = defaultPlayers();
      }
    } catch (e) {
      persistenceBroken = true;
      players = defaultPlayers();
    }
  }

  // ---------- Wire up events ----------
  els.timerChip.addEventListener('click', function () {
    els.timerDrawer.hidden ? openTimerDrawer() : closeTimerDrawer();
  });
  els.timerDrawerBackdrop.addEventListener('click', closeTimerDrawer);
  els.timerModeSeg.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-mode]');
    if (btn) setTimerMode(btn.dataset.mode);
  });
  els.applyTimerBtn.addEventListener('click', applyTimerSet);
  els.timerResetBtn.addEventListener('click', resetTimer);
  els.timerToggleBtn.addEventListener('click', toggleTimer);

  els.undoBtn.addEventListener('click', undo);
  els.settingsBtn.addEventListener('click', openSettings);
  els.closeSettingsBtn.addEventListener('click', closeSettings);
  els.settingsOverlay.addEventListener('click', function (e) { if (e.target === els.settingsOverlay) closeSettings(); });

  els.addPlayerBtn.addEventListener('click', addPlayer);
  els.resetScoresBtn.addEventListener('click', resetScores);
  els.nextTurnBtn.addEventListener('click', nextTurn);
  els.resetAllBtn.addEventListener('click', resetEverything);

  els.scoreStepSeg.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-step]');
    if (!btn) return;
    settings.scoreStep = Number(btn.dataset.step);
    setSegActive(els.scoreStepSeg, 'step', settings.scoreStep);
    saveState();
  });
  els.winnerRuleSeg.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-rule]');
    if (!btn) return;
    settings.winnerRule = btn.dataset.rule;
    setSegActive(els.winnerRuleSeg, 'rule', settings.winnerRule);
    updateCrowns();
    saveState();
  });
  els.themeSeg.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-theme]');
    if (!btn) return;
    settings.theme = btn.dataset.theme;
    setSegActive(els.themeSeg, 'theme', settings.theme);
    applyTheme();
    saveState();
  });
  els.allowNegativeToggle.addEventListener('change', function (e) { settings.allowNegative = e.target.checked; saveState(); });
  els.turnTrackingToggle.addEventListener('change', function (e) {
    settings.turnTracking = e.target.checked;
    if (settings.turnTracking && currentTurnId == null && players.length) currentTurnId = players[0].id;
    renderBoard();
    saveState();
  });
  els.soundToggle.addEventListener('change', function (e) { settings.sound = e.target.checked; saveState(); });
  els.vibrationToggle.addEventListener('change', function (e) { settings.vibration = e.target.checked; saveState(); });
  els.keepAwakeToggle.addEventListener('change', function (e) {
    settings.keepAwake = e.target.checked;
    saveState();
    if (settings.keepAwake) requestWakeLock(); else releaseWakeLock();
  });

  // ---------- Init ----------
  loadSettings();
  applyTheme();
  loadState();
  syncSettingsUI();
  els.timerSetFields.hidden = timer.mode !== 'countdown';
  setSegActive(els.timerModeSeg, 'mode', timer.mode);
  renderBoard();
  updateTimerDisplay();
  if (timer.running) { cancelAnimationFrame(timerRAF); timerRAF = requestAnimationFrame(timerTick); }
  requestWakeLock();
})();
</script>
</body>
</html>
