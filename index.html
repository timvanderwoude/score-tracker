<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230A84FF'/%3E%3Ctext x='50' y='68' font-size='58' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3E%23%3C/text%3E%3C/svg%3E">
<title>Score Tracker</title>
<script>
  // Resolve theme before first paint to avoid a flash of the wrong theme.
  (function () {
    try {
      var raw = localStorage.getItem('score-tracker-settings');
      var theme = raw ? (JSON.parse(raw).theme || 'system') : 'system';
      var resolved = theme === 'system'
        ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : theme;
      document.documentElement.setAttribute('data-theme', resolved);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<style>
  /* Color values are Apple's documented iOS system colors (Human Interface
     Guidelines), not approximations — systemBlue/Green/Red, label opacities,
     and the systemGroupedBackground layering (page vs. card surface). */
  :root {
    --bg: #000000;
    --panel: #1C1C1E;
    --panel-2: #2C2C2E;
    --panel-3: #3A3A3C;
    --border: #38383A;
    --text: #FFFFFF;
    --text-dim: rgba(235, 235, 245, 0.6);
    --text-faint: rgba(235, 235, 245, 0.3);
    --blue: #0A84FF;
    --green: #30D158;
    --red: #FF453A;
    --shadow: rgba(0, 0, 0, 0.45);
    --selection-bg: rgba(10, 132, 255, 0.35);
    --overlay: rgba(0, 0, 0, 0.55);
    /* Plain rgba rather than color-mix(): color-mix() shipped in Safari/
       Firefox slightly later than backdrop-filter did, so a browser that
       supports the blur but not the mix function would otherwise render
       these panels with no background at all. */
    --panel-translucent: rgba(28, 28, 30, 0.78);
    --panel-2-translucent: rgba(44, 44, 46, 0.85);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #F2F2F7;
    --panel: #FFFFFF;
    --panel-2: #E9E9EB;
    --panel-3: #FFFFFF;
    --border: #C6C6C8;
    --text: #000000;
    --text-dim: rgba(60, 60, 67, 0.6);
    --text-faint: rgba(60, 60, 67, 0.3);
    --blue: #007AFF;
    --green: #34C759;
    --red: #FF3B30;
    --shadow: rgba(0, 0, 0, 0.1);
    --selection-bg: rgba(0, 122, 255, 0.22);
    --overlay: rgba(0, 0, 0, 0.4);
    --panel-translucent: rgba(255, 255, 255, 0.78);
    --panel-2-translucent: rgba(233, 233, 235, 0.85);
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s ease, color 0.2s ease;
  }
  button, input, select { font-family: inherit; }
  button { touch-action: manipulation; -webkit-user-select: none; user-select: none; background: none; }
  ::selection { background: var(--selection-bg); }
  svg { display: block; }

  .app {
    /* vh first as a fallback for browsers without dvh support (Safari <15.4,
       Firefox <101); the dvh line overrides it wherever it's understood. An
       unsupported declaration is simply ignored, so this is a safe two-line
       progressive enhancement rather than an either/or branch. */
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    gap: 10px;
  }

  /* ---------- Materials (iOS "thin material" blur) ---------- */
  .material {
    background: var(--panel-translucent);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
  }
  @supports not (backdrop-filter: blur(1px)) {
    .material { background: var(--panel); }
  }

  /* ---------- Top bar ---------- */
  .topbar {
    /* z-index (with position) gives the whole topbar its own stacking
       context. Without it, .board — a scroll container via overflow:auto,
       which makes it a stacking context of its own in modern browsers —
       paints entirely above the topbar's subtree since it comes later in
       DOM order, no matter what z-index the timer-drawer sets locally. */
    position: relative;
    z-index: 10;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    border-radius: 16px;
    padding: 8px;
  }
  .timer-chip {
    position: relative;
    z-index: 22;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel-2);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 14px 7px 10px;
    cursor: pointer;
    font-size: 1.05rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .timer-chip .mode-icon { width: 17px; height: 17px; color: var(--text-dim); flex: 0 0 auto; }
  .timer-chip.time-up { color: var(--red); }
  .timer-chip.time-up .mode-icon { color: var(--red); }
  .timer-chip.shake { animation: shake 0.35s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  .icon-btn {
    position: relative;
    z-index: 22;
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .icon-btn svg { width: 19px; height: 19px; }
  .icon-btn:active { transform: scale(0.92); opacity: 0.7; }
  .icon-btn:disabled { opacity: 0.32; cursor: default; }
  .icon-btn:disabled:active { transform: none; }
  .icon-btn.primary { background: var(--blue); color: #fff; }
  .spacer { flex: 1 1 auto; }

  .timer-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  .timer-drawer-backdrop.open { pointer-events: auto; }
  .timer-drawer {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    z-index: 21;
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 12px 28px var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 12px;
    transform-origin: top left;
    transform: scale(0.94) translateY(-4px);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.22s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.16s ease;
  }
  .timer-drawer.open {
    transform: scale(1) translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .seg {
    display: flex;
    background: var(--panel-2);
    border-radius: 10px;
    padding: 2px;
    gap: 2px;
  }
  .seg button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-dim);
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 590;
    transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }
  .seg button.active {
    background: var(--panel-3);
    color: var(--blue);
    box-shadow: 0 1px 3px var(--shadow);
  }
  :root[data-theme="light"] .seg { background: #E5E5EA; }
  :root[data-theme="light"] .seg button.active { background: #FFFFFF; }

  .timer-set-fields {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  .timer-quick-input {
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    background: var(--panel-2);
    border: none;
    border-radius: 8px;
    color: var(--text);
    padding: 7px 10px;
    width: 6ch;
    text-align: center;
  }
  .timer-quick-preview {
    font-size: 0.9rem;
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    min-width: 4.5ch;
  }
  .timer-quick-hint {
    flex-basis: 100%;
    /* Flex items default to min-width:auto, which refuses to shrink below
       the content's unwrapped intrinsic width — without this, long text
       in a wrapping flex container overflows instead of wrapping. */
    min-width: 0;
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-faint);
  }
  .pill-btn {
    background: var(--panel-2);
    border: none;
    color: var(--text);
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.92rem;
    font-weight: 590;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .pill-btn:active { transform: scale(0.96); opacity: 0.75; }
  .pill-btn.accent { background: var(--blue); color: #fff; }
  .pill-btn.danger { background: var(--red); color: #fff; }
  .pill-btn:disabled { opacity: 0.35; cursor: default; transform: none; }
  .pill-btn.full { width: 100%; }

  /* ---------- Board ---------- */
  .board {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    gap: calc(10px * var(--card-scale, 1));
    overflow: auto;
  }

  .player {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: calc(16px * var(--card-scale, 1));
    padding: calc(16px * var(--card-scale, 1)) calc(12px * var(--card-scale, 1));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(8px * var(--card-scale, 1));
    border-top: calc(4px * var(--card-scale, 1)) solid var(--accent, #0A84FF);
    min-width: 0;
    min-height: 0;
    transition: box-shadow 0.2s ease;
  }
  .player.is-turn {
    box-shadow: 0 0 0 calc(2.5px * var(--card-scale, 1)) var(--accent, #0A84FF);
  }

  .remove-player {
    position: absolute;
    top: calc(6px * var(--card-scale, 1));
    right: calc(6px * var(--card-scale, 1));
    width: calc(24px * var(--card-scale, 1));
    height: calc(24px * var(--card-scale, 1));
    min-width: 20px;
    min-height: 20px;
    border-radius: 50%;
    border: none;
    background: var(--panel-2);
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .remove-player svg { width: 55%; height: 55%; }
  .remove-player:active { transform: scale(0.9); }

  .crown {
    position: absolute;
    top: calc(6px * var(--card-scale, 1));
    left: calc(7px * var(--card-scale, 1));
    width: calc(16px * var(--card-scale, 1));
    height: calc(16px * var(--card-scale, 1));
    color: #FFD60A;
  }

  .player-name {
    width: 100%;
    max-width: 100%;
    text-align: center;
    background: transparent;
    border: none;
    border-bottom: 1.5px dashed var(--border);
    color: var(--text);
    font-size: calc(14px * var(--text-scale, 1));
    font-weight: 590;
    padding: calc(4px * var(--card-scale, 1)) 2px;
    outline: none;
    text-overflow: ellipsis;
  }
  .player-name:focus { border-bottom-color: var(--blue); }

  .score-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: calc(10px * var(--card-scale, 1));
    min-height: 0;
  }
  .score-tap {
    position: relative;
    cursor: pointer;
    border-radius: calc(10px * var(--card-scale, 1));
  }
  .score-tap:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 3px;
  }
  .score {
    font-size: calc(3rem * var(--text-scale, 1));
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height: 1;
    text-align: center;
    min-width: 1.4ch;
  }
  .edit-hint {
    position: absolute;
    top: calc(-3px * var(--card-scale, 1));
    right: calc(-15px * var(--card-scale, 1));
    width: calc(13px * var(--card-scale, 1));
    height: calc(13px * var(--card-scale, 1));
    color: var(--text-faint);
  }
  .score-tap:active { opacity: 0.6; }

  button.step {
    width: calc(46px * var(--card-scale, 1));
    height: calc(46px * var(--card-scale, 1));
    min-width: 32px;
    min-height: 32px;
    border-radius: 50%;
    border: none;
    color: #fff;
    cursor: pointer;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s ease;
  }
  button.step svg { width: 46%; height: 46%; }
  button.step:active { transform: scale(0.88); }
  .plus { background: var(--green); }
  .minus { background: var(--red); }

  /* Quick-add chips: optional secondary row of preset values (e.g. +2, +3
     for basketball, or a custom cribbage/Yahtzee list) beneath the main
     +/- buttons. Horizontal scroll rather than wrap keeps a card's height
     predictable regardless of how many chips are configured, which the
     no-scroll grid layout depends on to size everything correctly. */
  .chip-row {
    display: flex;
    gap: calc(6px * var(--card-scale, 1));
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding: 1px calc(3px * var(--card-scale, 1)) 3px;
    mask-image: linear-gradient(to right, transparent 0, black 10px, black calc(100% - 10px), transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0, black 10px, black calc(100% - 10px), transparent 100%);
  }
  .chip-row::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .chip {
    flex: 0 0 auto;
    border: none;
    border-radius: 999px;
    /* Sized off --text-scale (floor 0.62), not --card-scale (floor 0.4) —
       these are tap targets carrying real information (a number), not
       decorative chrome, so they shouldn't shrink as aggressively as
       borders/padding do at the 12-player extreme. */
    padding: calc(7px * var(--text-scale, 1)) calc(13px * var(--text-scale, 1));
    font-size: calc(0.85rem * var(--text-scale, 1));
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    color: #fff;
    cursor: pointer;
  }
  .chip:active { transform: scale(0.9); }
  .chip-pos { background: var(--green); }
  .chip-neg { background: var(--red); }

  /* ---------- Bottom bar ---------- */
  .bottombar {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    border-radius: 16px;
    padding: 8px;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    top: max(70px, calc(env(safe-area-inset-top) + 60px));
    transform: translateX(-50%) translateY(-10px);
    background: var(--panel-2-translucent);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 550;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 50;
    max-width: 90vw;
    text-align: center;
    box-shadow: 0 6px 20px var(--shadow);
  }
  @supports not (backdrop-filter: blur(1px)) {
    .toast { background: var(--panel-2); }
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Settings sheet ---------- */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0);
    display: flex;
    align-items: flex-end;
    z-index: 40;
    pointer-events: none;
    transition: background 0.3s ease;
  }
  .sheet-overlay.open {
    background: var(--overlay);
    pointer-events: auto;
  }
  .sheet {
    width: 100%;
    max-height: min(88vh, 720px);
    max-height: min(88dvh, 720px);
    background: var(--bg);
    border-radius: 20px 20px 0 0;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -8px 30px var(--shadow);
    transform: translateY(100%);
    transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .sheet-overlay.open .sheet { transform: translateY(0); }
  .sheet-grabber {
    flex: 0 0 auto;
    width: 36px;
    height: 5px;
    border-radius: 999px;
    background: var(--border);
    margin: 8px auto 0;
  }
  .sheet-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px 8px;
  }
  .sheet-header h2 { margin: 0; font-size: 1.1rem; font-weight: 650; }
  .sheet-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 4px 16px calc(24px + env(safe-area-inset-bottom));
  }
  .settings-section { margin-bottom: 24px; }
  .settings-section h3 {
    margin: 0 0 8px;
    padding: 0 14px;
    font-size: 0.75rem;
    font-weight: 590;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
  }
  .settings-card {
    background: var(--panel);
    border-radius: 14px;
    overflow: hidden;
  }
  .setting-row {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
  }
  .setting-row::after {
    content: "";
    position: absolute;
    left: 14px;
    right: 0;
    bottom: 0;
    height: 1px;
    background: var(--border);
  }
  .setting-row:last-child::after { display: none; }
  .setting-row > span { font-size: 0.98rem; }
  .setting-row .seg { max-width: 200px; }
  .setting-row.stacked { flex-direction: column; align-items: stretch; gap: 10px; }
  .setting-row.stacked > span { font-size: 0.98rem; }
  .chip-slots {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .chip-slot {
    display: flex;
    background: var(--panel-2);
    border-radius: 8px;
    overflow: hidden;
  }
  .chip-slot-sign {
    flex: 0 0 auto;
    width: 30px;
    border: none;
    background: var(--panel-3);
    color: var(--text-dim);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .chip-slot-sign[data-sign="-1"] { color: var(--red); }
  .chip-slot-sign[data-sign="1"] { color: var(--green); }
  .chip-slot-input {
    width: 100%;
    min-width: 0;
    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-align: center;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 9px 2px;
  }
  .chip-slot-input::placeholder { color: var(--text-faint); }
  .suggestion-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding-bottom: 2px;
  }
  .suggestion-row::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .suggestion-chip {
    flex: 0 0 auto;
    border: none;
    background: var(--panel-2);
    color: var(--blue);
    font-size: 0.82rem;
    font-weight: 590;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .suggestion-chip:active { opacity: 0.7; }
  .suggestion-chip.clear { color: var(--text-dim); }

  /* ---------- Calculator sheet ---------- */
  .calc-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 20px calc(20px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .calc-preview {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
  }
  .calc-preview #calcResult {
    color: var(--text);
    font-size: 1.6rem;
    font-weight: 750;
  }
  .calc-op { padding: 0 4px; }
  .calc-eq { padding: 0 6px; }
  .calc-mode-seg button { font-size: 0.88rem; padding: 10px; }
  .calc-sign-seg button { font-size: 1.05rem; font-weight: 700; padding: 10px; }
  .calc-keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .calc-keypad button {
    border: none;
    background: var(--panel-2);
    color: var(--text);
    font-size: 1.4rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    border-radius: 12px;
    padding: 16px 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .calc-keypad button:active { transform: scale(0.95); opacity: 0.8; }
  .calc-keypad button.calc-key-text { color: var(--red); font-size: 1.1rem; }
  .calc-keypad button svg { width: 22px; height: 22px; }
  .calc-apply-btn { font-size: 1.05rem; padding: 14px; }

  .switch { position: relative; display: inline-block; width: 51px; height: 31px; flex: 0 0 auto; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .slider {
    position: absolute; inset: 0; cursor: pointer;
    background: var(--panel-2);
    border-radius: 999px;
    transition: background 0.2s ease;
  }
  .switch .slider::before {
    content: ""; position: absolute; height: 27px; width: 27px; left: 2px; top: 2px;
    background: #fff; border-radius: 50%;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2), 0 0 0 0.5px rgba(0,0,0,0.04);
    transition: transform 0.2s cubic-bezier(0.32, 0.72, 0, 1), width 0.15s ease;
  }
  .switch input:checked + .slider { background: var(--green); }
  .switch input:checked + .slider::before { transform: translateX(20px); }
  .switch input:active + .slider::before { width: 31px; }
  .switch input:checked:active + .slider::before { transform: translateX(16px); }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar material">
    <button class="timer-chip" id="timerChip" aria-label="Open timer settings">
      <span class="mode-icon" id="timerModeIcon"></span>

    <button class="icon-btn primary" id="timerToggleBtn" aria-label="Start timer"></button>

    <div class="spacer"></div>
    <button class="icon-btn" id="undoBtn" aria-label="Undo" disabled></button>
    <button class="icon-btn" id="redoBtn" aria-label="Redo" disabled></button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings"></button>

    <div class="timer-drawer-backdrop" id="timerDrawerBackdrop" inert></div>

<div class="toast" id="toast"></div>

<div class="sheet-overlay" id="settingsOverlay" inert>
  <div class="sheet" role="dialog" aria-label="Settings">

              <div class="chip-slot"><button type="button" class="chip-slot-sign" data-slot="1" data-sign="1" aria-label="Preset 2 sign">+</button><input class="chip-slot-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-label="Preset 2 value" data-slot="1"></div>
              <div class="chip-slot"><button type="button" class="chip-slot-sign" data-slot="2" data-sign="1" aria-label="Preset 3 sign">+</button><input class="chip-slot-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-label="Preset 3 value" data-slot="2"></div>
              <div class="chip-slot"><button type="button" class="chip-slot-sign" data-slot="3" data-sign="1" aria-label="Preset 4 sign">+</button><input class="chip-slot-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-label="Preset 4 value" data-slot="3"></div>
              <div class="chip-slot"><button type="button" class="chip-slot-sign" data-slot="4" data-sign="1" aria-label="Preset 5 sign">+</button><input class="chip-slot-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-label="Preset 5 value" data-slot="4"></div>

<script>
(function () {
  'use strict';

  var STATE_KEY = 'score-tracker-state';
  var SETTINGS_KEY = 'score-tracker-settings';
  var MAX_PLAYERS = 12;
  var ACCENTS = ['#0A84FF', '#FF453A', '#30D158', '#FF9F0A', '#BF5AF2', '#64D2FF', '#FF375F', '#FFD60A', '#FF6B57', '#5AC8FA', '#FF2D92', '#A2E057'];

  // ---------- Icons ----------
  // Hand-built inline SVGs (viewBox 0 0 24 24, stroke-based line icons in the
  // SF Symbols "regular" style) so the whole app stays a single dependency-
  // free file — no icon font or external sprite to fetch.
  var ICON_PATHS = {
    play: '<path d="M8 5.5v13a1 1 0 0 0 1.53.85l10.5-6.5a1 1 0 0 0 0-1.7L9.53 4.65A1 1 0 0 0 8 5.5z" fill="currentColor" stroke="none"/>',
    pause: '<rect x="6" y="5" width="4.5" height="14" rx="1.3" fill="currentColor" stroke="none"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.3" fill="currentColor" stroke="none"/>',
    resetTimer: '<path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v5h-5"/>',
    undo: '<path d="M9 15 4 10l5-5"/><path d="M4 10h10.5a5.5 5.5 0 0 1 0 11H12"/>',
    redo: '<path d="M15 15l5-5-5-5"/><path d="M20 10H9.5a5.5 5.5 0 0 0 0 11H12"/>',
    settings: '<line x1="4" y1="6.5" x2="14" y2="6.5"/><line x1="17" y1="6.5" x2="20" y2="6.5"/><circle cx="15.5" cy="6.5" r="1.9"/>' +
      '<line x1="4" y1="12" x2="9" y2="12"/><line x1="12.2" y1="12" x2="20" y2="12"/><circle cx="10.6" cy="12" r="1.9"/>' +
      '<line x1="4" y1="17.5" x2="12" y2="17.5"/><line x1="15" y1="17.5" x2="20" y2="17.5"/><circle cx="13.5" cy="17.5" r="1.9"/>',
    close: '<path d="M6 6l12 12"/><path d="M18 6L6 18"/>',
    crown: '<path d="M3.5 8.5 7 11.5 12 5l5 6.5 3.5-3-1.6 9.5H5.1L3.5 8.5z" fill="currentColor" stroke="currentColor" stroke-width="1"/>',
    pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.2 2"/>',
    stopwatch: '<circle cx="12" cy="13" r="7.5"/><path d="M12 9.3V13l2.4 1.9"/><path d="M9.5 2.3h5"/><path d="M12 2.3V5"/>',
    backspace: '<path d="M9 4.5h11a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5H9l-6.5-7.5L9 4.5z"/><path d="M13.5 9.5l5 5"/><path d="M18.5 9.5l-5 5"/>'
  };
  function svgIcon(name, strokeWidth) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (strokeWidth || 1.8) +
      '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + ICON_PATHS[name] + '</svg>';
  }

  var els = {};
  ['app', 'board', 'timerChip', 'timerChipTime', 'timerModeIcon', 'timerToggleBtn',
   'undoBtn', 'redoBtn', 'settingsBtn', 'timerDrawer', 'timerDrawerBackdrop', 'timerModeSeg',
   'timerSetFields', 'timerQuickInput', 'timerQuickPreview', 'applyTimerBtn', 'timerResetBtn',
   'nextTurnBtn', 'addPlayerBtn', 'resetScoresBtn', 'toast', 'settingsOverlay',
   'closeSettingsBtn', 'scoreStepSeg', 'chipSlots', 'quickChipsSuggestions',
   'allowNegativeToggle', 'winnerRuleSeg',
   'turnTrackingToggle', 'soundToggle', 'vibrationToggle', 'keepAwakeToggle', 'themeSeg',
   'resetAllBtn', 'calcOverlay', 'calcPlayerName', 'calcCloseBtn', 'calcModeSeg', 'calcBase',
   'calcOpDisplay', 'calcEqSpan', 'calcEntry', 'calcResult', 'calcSignSeg', 'calcKeypad',
   'calcBackBtn', 'calcApplyBtn'
  ].forEach(function (id) { els[id] = document.getElementById(id); });
  var chipSlotInputs = Array.prototype.slice.call(document.querySelectorAll('.chip-slot-input'));
  var chipSlotSigns = Array.prototype.slice.call(document.querySelectorAll('.chip-slot-sign'));

  // Static icon-only buttons: fill in their SVG once at startup.
  els.timerToggleBtn.innerHTML = svgIcon('play');
  els.timerResetBtn.innerHTML = svgIcon('resetTimer');
  els.undoBtn.innerHTML = svgIcon('undo');
  els.redoBtn.innerHTML = svgIcon('redo');
  els.settingsBtn.innerHTML = svgIcon('settings');
  els.closeSettingsBtn.innerHTML = svgIcon('close');
  els.calcCloseBtn.innerHTML = svgIcon('close');
  els.calcBackBtn.innerHTML = svgIcon('backspace', 2);

  var persistenceBroken = false;

  var settings = {
    theme: 'system',
    scoreStep: 1,
    quickChips: [],       // optional preset buttons per card, e.g. [2, 3] or [-20, -40, -60]
    allowNegative: true,
    winnerRule: 'highest',
    turnTracking: false,
    keepAwake: false,
    sound: true,
    vibration: true
  };

  var players = [];
  var playerCounter = 2;
  var currentTurnId = null;

  var timer = {
    mode: 'countdown',        // 'countdown' | 'stopwatch'
    totalSeconds: 300,        // countdown target
    endAt: null,              // epoch ms when countdown running
    remainingAtPause: 300,    // countdown remaining while paused
    startAt: null,            // epoch ms when stopwatch running
    accumulated: 0,           // stopwatch accumulated ms while paused
    running: false
  };
  var timerRAF = null;

  var undoStack = [];
  var redoStack = [];
  var audioCtx = null;

  // ---------- Utilities ----------
  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

  function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { els.toast.classList.remove('show'); }, 1600);
  }

  function vibrate(pattern) {
    if (!settings.vibration || !navigator.vibrate) return;
    try { navigator.vibrate(pattern); } catch (e) {}
  }

  function ensureAudioCtx() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  // Unlock/create the AudioContext on the very first user gesture, so it's
  // already running by the time a non-gesture event (timer end) needs it.
  document.addEventListener('pointerdown', ensureAudioCtx, { once: true });
  document.addEventListener('keydown', ensureAudioCtx, { once: true });

  function beep(freq, duration, delay) {
    if (!settings.sound) return;
    try {
      ensureAudioCtx();
      var t0 = audioCtx.currentTime + (delay || 0);
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.18, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + (duration || 0.15));
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + (duration || 0.15) + 0.02);
    } catch (e) {}
  }

  function tapFeedback() { vibrate(8); }

  function timeUpAlert() {
    beep(880, 0.16, 0); beep(880, 0.16, 0.22); beep(1046, 0.22, 0.44);
    vibrate([150, 90, 150, 90, 220]);
  }

  // ---------- Theme ----------
  function resolveTheme() {
    return settings.theme === 'system'
      ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      : settings.theme;
  }
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', resolveTheme());
  }
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function () {
    if (settings.theme === 'system') applyTheme();
  });

  // ---------- Wake Lock ----------
  var wakeLock = null;
  function requestWakeLock() {
    if (!settings.keepAwake || !('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
    }).catch(function () { /* ignore: no user gesture yet, or unsupported */ });
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && settings.keepAwake) requestWakeLock();
  });

  // ---------- Undo / Redo ----------
  function currentSnapshot() {
    return {
      players: JSON.parse(JSON.stringify(players)),
      playerCounter: playerCounter,
      currentTurnId: currentTurnId
    };
  }
  function applySnapshot(snap) {
    players = snap.players;
    playerCounter = snap.playerCounter;
    currentTurnId = snap.currentTurnId;
    renderBoard();
    saveState();
  }
  function updateHistoryButtons() {
    els.undoBtn.disabled = undoStack.length === 0;
    els.redoBtn.disabled = redoStack.length === 0;
  }
  function snapshot() {
    undoStack.push(currentSnapshot());
    if (undoStack.length > 25) undoStack.shift();
    redoStack = [];
    updateHistoryButtons();
  }
  function undo() {
    var snap = undoStack.pop();
    if (!snap) return;
    redoStack.push(currentSnapshot());
    applySnapshot(snap);
    updateHistoryButtons();
  }
  function redo() {
    var snap = redoStack.pop();
    if (!snap) return;
    undoStack.push(currentSnapshot());
    applySnapshot(snap);
    updateHistoryButtons();
  }

  // ---------- Timer ----------
  // Microwave-style entry: the last two digits typed are seconds, anything
  // before that is minutes — "3" -> 3 sec, "30" -> 30 sec, "300" -> 3 min,
  // "130" -> 1 min 30 sec. One field instead of two dropdowns.
  function microwaveInputToSeconds(str) {
    var digits = (str || '').replace(/[^0-9]/g, '');
    if (!digits) return 0;
    var secPart = digits.slice(-2);
    var minPart = digits.slice(0, -2);
    var seconds = parseInt(secPart, 10) || 0;
    var minutes = minPart ? (parseInt(minPart, 10) || 0) : 0;
    return minutes * 60 + seconds;
  }
  function secondsToMicrowaveInput(totalSec) {
    totalSec = Math.max(0, Math.round(totalSec));
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    return m === 0 ? String(s) : String(m) + String(s).padStart(2, '0');
  }
  function updateTimerQuickPreview() {
    els.timerQuickPreview.textContent = '→ ' + formatTime(microwaveInputToSeconds(els.timerQuickInput.value));
  }

  function formatTime(totalSec) {
    totalSec = Math.max(0, Math.round(totalSec));
    var m = Math.floor(totalSec / 60).toString().padStart(2, '0');
    var s = Math.floor(totalSec % 60).toString().padStart(2, '0');
    return m + ':' + s;
  }

  function countdownRemaining() {
    if (timer.running) return Math.max(0, (timer.endAt - Date.now()) / 1000);
    return timer.remainingAtPause;
  }
  function stopwatchElapsed() {
    var ms = timer.accumulated + (timer.running ? (Date.now() - timer.startAt) : 0);
    return ms / 1000;
  }

  function updateTimerDisplay() {
    var seconds = timer.mode === 'countdown' ? countdownRemaining() : stopwatchElapsed();
    els.timerChipTime.textContent = formatTime(seconds);
    els.timerModeIcon.innerHTML = svgIcon(timer.mode === 'countdown' ? 'clock' : 'stopwatch', 1.9);
    els.timerChip.classList.toggle('time-up', timer.mode === 'countdown' && seconds <= 0);
    els.timerToggleBtn.innerHTML = svgIcon(timer.running ? 'pause' : 'play');
    els.timerToggleBtn.setAttribute('aria-label', timer.running ? 'Pause timer' : 'Start timer');
  }

  function timerTick() {
    if (!timer.running) return;
    if (timer.mode === 'countdown') {
      var remaining = countdownRemaining();
      updateTimerDisplay();
      if (remaining <= 0) {
        pauseTimer();
        els.timerChip.classList.add('shake');
        setTimeout(function () { els.timerChip.classList.remove('shake'); }, 400);
        showToast("Time's up");
        timeUpAlert();
        return;
      }
    } else {
      updateTimerDisplay();
    }
    timerRAF = requestAnimationFrame(timerTick);
  }

  function startTimer() {
    if (timer.mode === 'countdown' && countdownRemaining() <= 0) {
      els.timerChip.classList.add('shake');
      setTimeout(function () { els.timerChip.classList.remove('shake'); }, 400);
      showToast('Set a time first');
      return;
    }
    if (timer.mode === 'countdown') {
      timer.endAt = Date.now() + countdownRemaining() * 1000;
    } else {
      timer.startAt = Date.now();
    }
    timer.running = true;
    cancelAnimationFrame(timerRAF);
    timerRAF = requestAnimationFrame(timerTick);
    saveState();
    updateTimerDisplay();
  }

  function pauseTimer() {
    if (timer.mode === 'countdown') {
      timer.remainingAtPause = countdownRemaining();
    } else {
      timer.accumulated = timer.accumulated + (timer.running ? (Date.now() - timer.startAt) : 0);
    }
    timer.running = false;
    cancelAnimationFrame(timerRAF);
    saveState();
    updateTimerDisplay();
  }

  function toggleTimer() { timer.running ? pauseTimer() : startTimer(); }

  function resetTimer() {
    var wasRunning = timer.running;
    timer.running = false;
    cancelAnimationFrame(timerRAF);
    if (timer.mode === 'countdown') {
      timer.remainingAtPause = timer.totalSeconds;
      timer.endAt = null;
    } else {
      timer.accumulated = 0;
      timer.startAt = null;
    }
    updateTimerDisplay();
    saveState();
    if (wasRunning) showToast('Timer reset');
  }

  function applyTimerSet() {
    timer.totalSeconds = microwaveInputToSeconds(els.timerQuickInput.value);
    timer.remainingAtPause = timer.totalSeconds;
    timer.running = false;
    cancelAnimationFrame(timerRAF);
    els.timerQuickInput.value = secondsToMicrowaveInput(timer.totalSeconds);
    updateTimerQuickPreview();
    updateTimerDisplay();
    saveState();
  }

  function setTimerMode(mode) {
    if (timer.mode === mode) return;
    pauseTimer();
    timer.mode = mode;
    els.timerSetFields.hidden = mode !== 'countdown';
    setSegActive(els.timerModeSeg, 'mode', mode);
    updateTimerDisplay();
    saveState();
  }

  function openTimerDrawer() {
    els.timerDrawer.classList.add('open');
    els.timerDrawerBackdrop.classList.add('open');
    els.timerDrawer.inert = false;
    els.timerDrawerBackdrop.inert = false;
  }
  function closeTimerDrawer() {
    els.timerDrawer.classList.remove('open');
    els.timerDrawerBackdrop.classList.remove('open');
    els.timerDrawer.inert = true;
    els.timerDrawerBackdrop.inert = true;
  }

  // ---------- Grid layout ----------
  function computeGrid(n, w, h) {
    if (n <= 0) return { cols: 1, rows: 1 };
    var best = null;
    for (var cols = 1; cols <= n; cols++) {
      var rows = Math.ceil(n / cols);
      var cellW = w / cols;
      var cellH = h / rows;
      var score = Math.min(cellW, cellH);
      if (!best || score > best.score) best = { cols: cols, rows: rows, score: score, cellW: cellW, cellH: cellH };
    }
    return best;
  }

  function relayoutBoard() {
    var rect = els.board.getBoundingClientRect();
    var w = rect.width, h = rect.height;
    if (w === 0 || h === 0) return;
    var g = computeGrid(players.length, w, h);
    els.board.style.gridTemplateColumns = 'repeat(' + g.cols + ', 1fr)';
    els.board.style.gridTemplateRows = 'repeat(' + g.rows + ', 1fr)';
    // Preset chips add a row to every card, so the "ideal" card height
    // used to size everything is taller whenever any are configured. The
    // calculator no longer lives in this row (it's reached by tapping the
    // score directly), so cards with no presets go back to the compact
    // height.
    var idealCardH = settings.quickChips.length ? 260 : 220;
    var layoutScale = clamp(Math.min(g.cellW / 250, g.cellH / idealCardH), 0.4, 1.3);
    // Text should shrink more gently than padding/buttons do, so names and
    // scores stay legible even when many players make cards physically small.
    var textScale = clamp(layoutScale, 0.62, 1.3);
    els.board.style.setProperty('--card-scale', layoutScale.toFixed(3));
    els.board.style.setProperty('--text-scale', textScale.toFixed(3));
  }

  var relayoutQueued = false;
  function scheduleRelayout() {
    if (relayoutQueued) return;
    relayoutQueued = true;
    requestAnimationFrame(function () { relayoutQueued = false; relayoutBoard(); });
  }
  window.addEventListener('resize', scheduleRelayout);
  window.addEventListener('orientationchange', scheduleRelayout);

  // ---------- Players / board ----------
  function defaultPlayers() {
    return [
      { id: 1, name: 'Player 1', score: 0 },
      { id: 2, name: 'Player 2', score: 0 }
    ];
  }

  // The keyboard covering a focused field is a mobile-web classic: html/body
  // are overflow:hidden here (by design, for the no-scroll layout), so the
  // browser has nothing to auto-scroll when the keyboard shows up. Scroll the
  // field into view ourselves, once immediately and once again when the
  // visualViewport actually finishes shrinking (Android in particular can
  // take a beat, and a fixed setTimeout alone would run before that resize).
  function keepFieldVisible(el) {
    var scrollNow = function () { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); };
    scrollNow();
    setTimeout(scrollNow, 300);
    if (window.visualViewport) {
      var vv = window.visualViewport;
      var onResize = function () {
        if (document.activeElement === el) scrollNow();
      };
      vv.addEventListener('resize', onResize);
      var cleanup = function () {
        vv.removeEventListener('resize', onResize);
        el.removeEventListener('blur', cleanup);
      };
      el.addEventListener('blur', cleanup, { once: true });
    }
  }

  function leaderIds() {
    if (settings.winnerRule === 'off' || players.length === 0) return [];
    var scores = players.map(function (p) { return p.score; });
    var allEqual = scores.every(function (s) { return s === scores[0]; });
    if (allEqual) return [];
    var target = settings.winnerRule === 'lowest' ? Math.min.apply(null, scores) : Math.max.apply(null, scores);
    return players.filter(function (p) { return p.score === target; }).map(function (p) { return p.id; });
  }

  function applyDelta(p, scoreEl, delta) {
    var next = p.score + delta;
    if (!settings.allowNegative) next = Math.max(0, next);
    p.score = next;
    scoreEl.textContent = p.score;
    if (scoreEl.parentElement) scoreEl.parentElement.setAttribute('aria-label', 'Edit score, currently ' + p.score);
    updateCrowns();
    saveState();
  }

  function updateCrowns() {
    var leaders = leaderIds();
    els.board.querySelectorAll('.player').forEach(function (card) {
      var id = Number(card.dataset.id);
      var crown = card.querySelector('.crown');
      if (!crown) return;
      crown.hidden = leaders.indexOf(id) === -1;
    });
  }

  function beginPressHold(fn) {
    var timeoutId, intervalId;
    return {
      start: function () {
        fn();
        timeoutId = setTimeout(function () {
          intervalId = setInterval(fn, 100);
        }, 420);
      },
      stop: function () {
        clearTimeout(timeoutId);
        clearInterval(intervalId);
      }
    };
  }

  function renderBoard() {
    els.board.innerHTML = '';
    players.forEach(function (p, idx) {
      var card = document.createElement('div');
      card.className = 'player';
      card.dataset.id = p.id;
      card.style.setProperty('--accent', ACCENTS[idx % ACCENTS.length]);
      if (settings.turnTracking && p.id === currentTurnId) card.classList.add('is-turn');

      var crown = document.createElement('div');
      crown.className = 'crown';
      crown.innerHTML = svgIcon('crown');
      crown.hidden = true;
      card.appendChild(crown);

      var removeBtn = document.createElement('button');
      removeBtn.className = 'remove-player';
      removeBtn.innerHTML = svgIcon('close', 2.2);
      removeBtn.title = 'Remove player';
      removeBtn.setAttribute('aria-label', 'Remove ' + p.name);
      removeBtn.onclick = function () { removePlayer(p.id); };
      card.appendChild(removeBtn);

      var nameInput = document.createElement('input');
      nameInput.className = 'player-name';
      nameInput.value = p.name;
      nameInput.maxLength = 24;
      nameInput.setAttribute('aria-label', 'Player name');
      nameInput.oninput = function (e) { p.name = e.target.value; saveState(); };
      nameInput.addEventListener('focus', function (e) { e.target.select(); keepFieldVisible(e.target); });
      card.appendChild(nameInput);

      var scoreWrap = document.createElement('div');
      scoreWrap.className = 'score-wrap';

      var minusBtn = document.createElement('button');
      minusBtn.className = 'step minus';
      minusBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>';
      minusBtn.setAttribute('aria-label', 'Decrease score');

      var scoreTap = document.createElement('div');
      scoreTap.className = 'score-tap';
      scoreTap.tabIndex = 0;
      scoreTap.setAttribute('role', 'button');
      scoreTap.setAttribute('aria-label', 'Edit score, currently ' + p.score);
      var scoreEl = document.createElement('div');
      scoreEl.className = 'score';
      scoreEl.textContent = p.score;
      var editHint = document.createElement('span');
      editHint.className = 'edit-hint';
      editHint.innerHTML = svgIcon('pencil', 2.2);
      scoreTap.appendChild(scoreEl);
      scoreTap.appendChild(editHint);
      scoreTap.addEventListener('click', function () { openCalculator(p, scoreEl, 'set'); });
      scoreTap.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          // Without this, the same keydown bubbles to the document-level
          // calculator shortcut listener right after openCalculator() runs
          // — which by then sees the overlay's 'open' class already set
          // and treats this same Enter as "confirm inside the calculator",
          // applying and closing it in the same dispatch it just opened in.
          e.stopPropagation();
          openCalculator(p, scoreEl, 'set');
        }
      });

      var plusBtn = document.createElement('button');
      plusBtn.className = 'step plus';
      plusBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
      plusBtn.setAttribute('aria-label', 'Increase score');

      var minusHold = beginPressHold(function () { applyDelta(p, scoreEl, -settings.scoreStep); });
      var plusHold = beginPressHold(function () { applyDelta(p, scoreEl, settings.scoreStep); });
      minusBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); snapshot(); minusHold.start(); });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { minusBtn.addEventListener(ev, minusHold.stop); });
      plusBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); snapshot(); plusHold.start(); });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { plusBtn.addEventListener(ev, plusHold.stop); });
      // pointerdown only fires for real pointer/touch input, not keyboard
      // (Tab + Enter/Space) activation — that instead dispatches a 'click'
      // with detail:0. Handle that case here without double-firing for
      // real clicks (which always have detail >= 1 and are already
      // handled above via pointerdown). Correlated by timing rather than
      // by checking event.detail === 0: that's a well-specified signal in
      // major engines, but a plain "was there a pointerdown on this button
      // in the last moment" check works identically everywhere regardless
      // of any one engine's exact UIEvent semantics.
      var minusPointerAt = 0, plusPointerAt = 0;
      minusBtn.addEventListener('pointerdown', function () { minusPointerAt = Date.now(); });
      plusBtn.addEventListener('pointerdown', function () { plusPointerAt = Date.now(); });
      minusBtn.addEventListener('click', function () { if (Date.now() - minusPointerAt > 500) { snapshot(); applyDelta(p, scoreEl, -settings.scoreStep); } });
      plusBtn.addEventListener('click', function () { if (Date.now() - plusPointerAt > 500) { snapshot(); applyDelta(p, scoreEl, settings.scoreStep); } });

      scoreWrap.appendChild(minusBtn);
      scoreWrap.appendChild(scoreTap);
      scoreWrap.appendChild(plusBtn);
      card.appendChild(scoreWrap);

      // The calculator lives behind tapping the score itself now (see
      // openCalculator below), so this row is presets only — and can go
      // back to being conditional, since there's no button that needs a
      // guaranteed home here regardless of whether any presets are set.
      if (settings.quickChips.length) {
        var chipRow = document.createElement('div');
        chipRow.className = 'chip-row';
        settings.quickChips.forEach(function (val) {
          var chip = document.createElement('button');
          chip.className = 'chip ' + (val < 0 ? 'chip-neg' : 'chip-pos');
          chip.textContent = (val > 0 ? '+' : '') + val;
          chip.setAttribute('aria-label', (val > 0 ? 'Add ' : 'Subtract ') + Math.abs(val));
          chip.addEventListener('click', function () { snapshot(); applyDelta(p, scoreEl, val); });
          chipRow.appendChild(chip);
        });
        card.appendChild(chipRow);
      }

      els.board.appendChild(card);
    });

    els.board.querySelectorAll('.remove-player').forEach(function (btn) {
      btn.style.display = players.length <= 1 ? 'none' : '';
    });

    els.addPlayerBtn.disabled = players.length >= MAX_PLAYERS;
    els.nextTurnBtn.hidden = !settings.turnTracking || players.length === 0;

    updateCrowns();
    scheduleRelayout();
  }

  // ---------- Calculator (tap-the-score editor: set or adjust) ----------
  // Tapping a score opens this in "Set score" mode by default (typing a
  // whole new value — the old behavior), with "Add / Subtract" one tap
  // away for relative entry (the gap-filler presets can't cover, e.g.
  // darts, where a turn can subtract almost any amount up to 180). One
  // entry point, one keypad, instead of a separate inline text field plus
  // a separate calculator icon competing for space on every card.
  //
  // This also sidesteps the on-screen-keyboard-has-no-minus-key problem
  // entirely: entry is built from the app's own keypad buttons, never a
  // native <input>, so there's no OS virtual keyboard involved at all.
  // Sign is chosen via an explicit +/- toggle instead of typing "-".
  var calcPlayer = null;
  var calcScoreEl = null;
  var calcMode = 'set';   // 'set' | 'adjust'
  var calcSign = 1;
  var calcEntry = '0';
  var calcReturnFocus = null;

  function calcEnteredNumber() { return parseInt(calcEntry, 10) || 0; }
  function calcResultValue() {
    if (!calcPlayer) return 0;
    var signed = calcSign * calcEnteredNumber();
    var result = calcMode === 'set' ? signed : calcPlayer.score + signed;
    if (!settings.allowNegative) result = Math.max(0, result);
    return result;
  }
  function updateCalcDisplay() {
    if (!calcPlayer) return;
    els.calcBase.textContent = calcPlayer.score;
    if (calcMode === 'set') {
      els.calcOpDisplay.textContent = '→';
      els.calcEntry.hidden = true;
      els.calcEqSpan.hidden = true;
    } else {
      els.calcOpDisplay.textContent = calcSign > 0 ? '+' : '−';
      els.calcEntry.textContent = calcEnteredNumber();
      els.calcEntry.hidden = false;
      els.calcEqSpan.hidden = false;
    }
    els.calcResult.textContent = calcResultValue();
  }
  function setCalcMode(mode) {
    calcMode = mode;
    setSegActive(els.calcModeSeg, 'mode', mode);
    updateCalcDisplay();
  }
  function setCalcSign(sign) {
    calcSign = sign;
    setSegActive(els.calcSignSeg, 'sign', sign);
    updateCalcDisplay();
  }
  function calcPressDigit(d) {
    calcEntry = calcEntry === '0' ? d : (calcEntry.length < 6 ? calcEntry + d : calcEntry);
    updateCalcDisplay();
  }
  function calcBackspace() {
    calcEntry = calcEntry.length > 1 ? calcEntry.slice(0, -1) : '0';
    updateCalcDisplay();
  }
  function calcClear() {
    calcEntry = '0';
    updateCalcDisplay();
  }

  function openCalculator(p, scoreEl, mode) {
    calcPlayer = p;
    calcScoreEl = scoreEl;
    calcMode = mode || 'set';
    calcSign = 1;
    calcEntry = '0';
    calcReturnFocus = document.activeElement;
    els.calcPlayerName.textContent = p.name;
    setSegActive(els.calcModeSeg, 'mode', calcMode);
    setSegActive(els.calcSignSeg, 'sign', 1);
    updateCalcDisplay();
    els.calcOverlay.classList.add('open');
    els.calcOverlay.inert = false;
  }
  function closeCalculator() {
    els.calcOverlay.classList.remove('open');
    els.calcOverlay.inert = true;
    calcPlayer = null;
    calcScoreEl = null;
    if (calcReturnFocus && typeof calcReturnFocus.focus === 'function') calcReturnFocus.focus();
  }
  function applyCalculator() {
    if (!calcPlayer) { closeCalculator(); return; }
    // Entering nothing in Add/Subtract mode is a no-op (adding 0 changes
    // nothing) — skip the snapshot so it doesn't clutter undo history.
    // In Set mode, 0 is a legitimate target value, so it still applies.
    if (calcMode === 'adjust' && calcEnteredNumber() === 0) { closeCalculator(); return; }
    snapshot();
    calcPlayer.score = calcResultValue();
    calcScoreEl.textContent = calcPlayer.score;
    if (calcScoreEl.parentElement) calcScoreEl.parentElement.setAttribute('aria-label', 'Edit score, currently ' + calcPlayer.score);
    updateCrowns();
    saveState();
    closeCalculator();
  }

  function addPlayer() {
    if (players.length >= MAX_PLAYERS) { showToast('Max ' + MAX_PLAYERS + ' players'); return; }
    snapshot();
    playerCounter += 1;
    players.push({ id: Date.now() + Math.random(), name: 'Player ' + playerCounter, score: 0 });
    renderBoard();
    saveState();
  }

  function removePlayer(id) {
    if (players.length <= 1) return;
    snapshot();
    players = players.filter(function (p) { return p.id !== id; });
    if (currentTurnId === id) currentTurnId = players.length ? players[0].id : null;
    renderBoard();
    saveState();
  }

  function resetScores() {
    snapshot();
    players.forEach(function (p) { p.score = 0; });
    renderBoard();
    saveState();
    showToast('Scores reset');
  }

  function resetEverything() {
    snapshot();
    players = defaultPlayers();
    playerCounter = 2;
    currentTurnId = null;
    resetTimer();
    renderBoard();
    saveState();
    closeSettings();
    showToast('Everything reset');
  }

  function nextTurn() {
    if (players.length === 0) return;
    var idx = players.findIndex(function (p) { return p.id === currentTurnId; });
    idx = (idx === -1 ? 0 : idx + 1) % players.length;
    currentTurnId = players[idx].id;
    tapFeedback();
    renderBoard();
    saveState();
  }

  // ---------- Settings UI ----------
  function setSegActive(container, dataAttr, value) {
    container.querySelectorAll('button').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset[dataAttr] === String(value));
    });
  }

  var settingsReturnFocus = null;
  function openSettings() {
    settingsReturnFocus = document.activeElement;
    els.settingsOverlay.classList.add('open');
    els.settingsOverlay.inert = false;
  }
  function closeSettings() {
    els.settingsOverlay.classList.remove('open');
    els.settingsOverlay.inert = true;
    if (settingsReturnFocus && typeof settingsReturnFocus.focus === 'function') settingsReturnFocus.focus();
  }

  function syncSettingsUI() {
    setSegActive(els.scoreStepSeg, 'step', settings.scoreStep);
    setSegActive(els.winnerRuleSeg, 'rule', settings.winnerRule);
    setSegActive(els.themeSeg, 'theme', settings.theme);
    els.allowNegativeToggle.checked = settings.allowNegative;
    els.turnTrackingToggle.checked = settings.turnTracking;
    els.soundToggle.checked = settings.sound;
    els.vibrationToggle.checked = settings.vibration;
    els.keepAwakeToggle.checked = settings.keepAwake;
    fillChipSlots(settings.quickChips);
  }

  // Six independent, stable preset slots rather than a parsed comma list —
  // editing one slot doesn't shuffle the others' positions. The slots may
  // have gaps (a cleared middle slot); settings.quickChips itself stays a
  // compact array, read fresh from all 6 inputs whenever any of them change.
  //
  // Each slot splits sign from magnitude: a dedicated +/- toggle button
  // plus a digits-only input (inputmode="numeric", no minus in the
  // pattern). Typing "-" on a virtual numeric keypad isn't reliable across
  // platforms — the toggle makes negative presets work everywhere without
  // depending on any OS keyboard variant having a minus key at all.
  function fillChipSlots(values) {
    chipSlotInputs.forEach(function (input, i) {
      var v = values[i];
      input.value = v !== undefined ? String(Math.abs(v)) : '';
    });
    chipSlotSigns.forEach(function (btn, i) {
      var v = values[i];
      var sign = (v !== undefined && v < 0) ? -1 : 1;
      btn.dataset.sign = String(sign);
      btn.textContent = sign === 1 ? '+' : '−';
    });
  }
  function readChipSlots() {
    return chipSlotInputs.map(function (input, i) {
      var mag = parseInt(input.value.trim(), 10);
      if (isNaN(mag) || mag === 0) return null;
      var sign = chipSlotSigns[i].dataset.sign === '-1' ? -1 : 1;
      return sign * mag;
    }).filter(function (n) { return n !== null; }).slice(0, 6);
  }

  // ---------- Persistence ----------
  function saveState() {
    if (persistenceBroken) return;
    try {
      var timerPayload = { mode: timer.mode, totalSeconds: timer.totalSeconds, running: timer.running };
      if (timer.mode === 'countdown') {
        if (timer.running) { timerPayload.endAt = timer.endAt; }
        else { timerPayload.remainingAtPause = timer.remainingAtPause; }
      } else {
        timerPayload.accumulated = timer.accumulated;
        if (timer.running) { timerPayload.startAt = timer.startAt; }
      }
      localStorage.setItem(STATE_KEY, JSON.stringify({
        players: players, playerCounter: playerCounter, currentTurnId: currentTurnId,
        timer: timerPayload
      }));
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    } catch (e) {
      persistenceBroken = true;
      showToast('Persistence unavailable in this view');
    }
  }

  function loadSettings() {
    try {
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) {
        var loaded = JSON.parse(raw);
        Object.keys(settings).forEach(function (k) {
          if (loaded[k] !== undefined) settings[k] = loaded[k];
        });
      }
    } catch (e) { persistenceBroken = true; }
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STATE_KEY);
      if (raw) {
        var state = JSON.parse(raw);
        if (Array.isArray(state.players) && state.players.length > 0) {
          players = state.players.map(function (p) {
            return { id: p.id, name: p.name || 'Player', score: Number(p.score) || 0 };
          });
        } else {
          players = defaultPlayers();
        }
        playerCounter = typeof state.playerCounter === 'number' ? state.playerCounter : players.length;
        currentTurnId = state.currentTurnId != null ? state.currentTurnId : null;

        if (state.timer) {
          timer.mode = state.timer.mode === 'stopwatch' ? 'stopwatch' : 'countdown';
          timer.totalSeconds = typeof state.timer.totalSeconds === 'number' ? state.timer.totalSeconds : 300;
          els.timerQuickInput.value = secondsToMicrowaveInput(timer.totalSeconds);
          els.timerSetFields.hidden = timer.mode !== 'countdown';
          setSegActive(els.timerModeSeg, 'mode', timer.mode);

          if (timer.mode === 'countdown') {
            if (state.timer.running && typeof state.timer.endAt === 'number') {
              var remaining = (state.timer.endAt - Date.now()) / 1000;
              if (remaining > 0) {
                timer.endAt = state.timer.endAt;
                timer.running = true;
              } else {
                timer.running = false;
                timer.remainingAtPause = 0;
              }
            } else {
              timer.running = false;
              timer.remainingAtPause = typeof state.timer.remainingAtPause === 'number' ? state.timer.remainingAtPause : timer.totalSeconds;
            }
          } else {
            timer.accumulated = typeof state.timer.accumulated === 'number' ? state.timer.accumulated : 0;
            if (state.timer.running && typeof state.timer.startAt === 'number') {
              timer.startAt = state.timer.startAt;
              timer.running = true;
            } else {
              timer.running = false;
            }
          }
        }
      } else {
        players = defaultPlayers();
      }
    } catch (e) {
      persistenceBroken = true;
      players = defaultPlayers();
    }
  }

  // ---------- Wire up events ----------
  els.timerChip.addEventListener('click', function () {
    els.timerDrawer.classList.contains('open') ? closeTimerDrawer() : openTimerDrawer();
  });
  els.timerDrawerBackdrop.addEventListener('click', closeTimerDrawer);
  els.timerModeSeg.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-mode]');
    if (btn) setTimerMode(btn.dataset.mode);
  });
  els.applyTimerBtn.addEventListener('click', applyTimerSet);
  els.timerResetBtn.addEventListener('click', resetTimer);
  els.timerToggleBtn.addEventListener('click', toggleTimer);
  els.timerQuickInput.addEventListener('input', updateTimerQuickPreview);
  els.timerQuickInput.addEventListener('focus', function (e) { e.target.select(); keepFieldVisible(e.target); });
  els.timerQuickInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { applyTimerSet(); e.target.blur(); }
  });

  els.undoBtn.addEventListener('click', undo);
  els.redoBtn.addEventListener('click', redo);
  els.settingsBtn.addEventListener('click', openSettings);
  els.closeSettingsBtn.addEventListener('click', closeSettings);
  els.settingsOverlay.addEventListener('click', function (e) { if (e.target === els.settingsOverlay) closeSettings(); });

  els.addPlayerBtn.addEventListener('click', addPlayer);
  els.resetScoresBtn.addEventListener('click', resetScores);
  els.nextTurnBtn.addEventListener('click', nextTurn);
  els.resetAllBtn.addEventListener('click', resetEverything);

  els.calcCloseBtn.addEventListener('click', closeCalculator);
  els.calcOverlay.addEventListener('click', function (e) { if (e.target === els.calcOverlay) closeCalculator(); });
  els.calcModeSeg.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-mode]');
    if (btn) setCalcMode(btn.dataset.mode);
  });
  els.calcSignSeg.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-sign]');
    if (btn) setCalcSign(Number(btn.dataset.sign));
  });
  els.calcKeypad.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-key]');
    if (!btn) return;
    var key = btn.dataset.key;
    if (key === 'back') calcBackspace();
    else if (key === 'clear') calcClear();
    else calcPressDigit(key);
  });
  els.calcApplyBtn.addEventListener('click', applyCalculator);
  document.addEventListener('keydown', function (e) {
    if (!els.calcOverlay.classList.contains('open')) return;
    if (e.key >= '0' && e.key <= '9') calcPressDigit(e.key);
    else if (e.key === 'Backspace') calcBackspace();
    else if (e.key === 'Enter') applyCalculator();
    else if (e.key === 'Escape') closeCalculator();
    else if (e.key === '+') setCalcSign(1);
    else if (e.key === '-') setCalcSign(-1);
  });

  els.scoreStepSeg.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-step]');
    if (!btn) return;
    settings.scoreStep = Number(btn.dataset.step);
    setSegActive(els.scoreStepSeg, 'step', settings.scoreStep);
    saveState();
  });
  chipSlotInputs.forEach(function (input) {
    input.addEventListener('focus', function (e) { e.target.select(); keepFieldVisible(e.target); });
    input.addEventListener('change', function () {
      settings.quickChips = readChipSlots();
      renderBoard();
      saveState();
    });
  });
  chipSlotSigns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var next = btn.dataset.sign === '1' ? '-1' : '1';
      btn.dataset.sign = next;
      btn.textContent = next === '1' ? '+' : '−';
      settings.quickChips = readChipSlots();
      renderBoard();
      saveState();
    });
  });
  els.quickChipsSuggestions.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-value]');
    if (!btn) return;
    var values = btn.dataset.value ? btn.dataset.value.split(',').map(function (s) { return parseInt(s.trim(), 10); }) : [];
    fillChipSlots(values);
    settings.quickChips = readChipSlots();
    renderBoard();
    saveState();
  });
  els.winnerRuleSeg.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-rule]');
    if (!btn) return;
    settings.winnerRule = btn.dataset.rule;
    setSegActive(els.winnerRuleSeg, 'rule', settings.winnerRule);
    updateCrowns();
    saveState();
  });
  els.themeSeg.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-theme]');
    if (!btn) return;
    settings.theme = btn.dataset.theme;
    setSegActive(els.themeSeg, 'theme', settings.theme);
    applyTheme();
    saveState();
  });
  els.allowNegativeToggle.addEventListener('change', function (e) { settings.allowNegative = e.target.checked; saveState(); });
  els.turnTrackingToggle.addEventListener('change', function (e) {
    settings.turnTracking = e.target.checked;
    if (settings.turnTracking && currentTurnId == null && players.length) currentTurnId = players[0].id;
    renderBoard();
    saveState();
  });
  els.soundToggle.addEventListener('change', function (e) { settings.sound = e.target.checked; saveState(); });
  els.vibrationToggle.addEventListener('change', function (e) { settings.vibration = e.target.checked; saveState(); });
  els.keepAwakeToggle.addEventListener('change', function (e) {
    settings.keepAwake = e.target.checked;
    saveState();
    if (settings.keepAwake) requestWakeLock(); else releaseWakeLock();
  });

  // ---------- Init ----------
  loadSettings();
  applyTheme();
  loadState();
  syncSettingsUI();
  els.timerSetFields.hidden = timer.mode !== 'countdown';
  setSegActive(els.timerModeSeg, 'mode', timer.mode);
  if (!els.timerQuickInput.value) els.timerQuickInput.value = secondsToMicrowaveInput(timer.totalSeconds);
  updateTimerQuickPreview();
  renderBoard();
  updateTimerDisplay();
  if (timer.running) { cancelAnimationFrame(timerRAF); timerRAF = requestAnimationFrame(timerTick); }
  requestWakeLock();
})();
</script>
</body>
</html>
